    .status-message {

    .summary-grid {

      display: grid;

      gap: 12px;

    .summary-card {

    .menu-box {

    }

    .menu-grid {

    .menu-button {

      justify-content: space-between;

      min-height: 72px;

      padding: 16px;

      font-weight: 700;

      text-decoration: none;

    }

    .menu-button span {

    }

    .loading-screen {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #ffffff;

      color: #333333;

      font-size: 17px;

    }

    @media (max-width: 700px) {

      .summary-grid {

        grid-template-columns: repeat(2, 1fr);

      }

      .menu-grid {

        grid-template-columns: 1fr;

      }

    }

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =

      "https://rbtwvemljpgnwhlzayqy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =

      "sb_publishable_m-Uc3eR2-57P36HMP_eHsQ_F5h1tfzu";

    const supabaseClient = window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );

    const loadingScreen =

      document.getElementById("loadingScreen");

    const adminName =

      document.getElementById("adminName");

    const logoutButton =

      document.getElementById("logoutButton");

    const statusMessage =

      document.getElementById("statusMessage");

    function showError(message) {

      statusMessage.textContent = message;

      statusMessage.className = "status-message error";

    }

    async function moveToLogin() {

      window.location.replace("./admin-login.html");

    }

    async function protectAdminPage() {

      try {

        const {

          data: { session },

          error: sessionError

        } = await supabaseClient.auth.getSession();

        if (sessionError) {

          throw sessionError;

        }

        if (!session) {

          await moveToLogin();

          return;

        }

        const {

          data: admin,

          error: adminError

        } = await supabaseClient

          .from("admin_users")

          .select(

            "user_id, display_name, role, is_active"

          )

          .eq("user_id", session.user.id)

          .eq("is_active", true)

          .maybeSingle();

        if (adminError) {

          throw adminError;

        }

        if (!admin) {

          await supabaseClient.auth.signOut();

          await moveToLogin();

          return;

        }

        adminName.textContent =

          admin.display_name || "대표님";

        loadingScreen.style.display = "none";

      } catch (error) {

        console.error(error);

        loadingScreen.style.display = "none";

        showError(

          error.message ||

          "관리자 정보를 확인하는 중 오류가 발생했습니다."

        );

      }

    }

    logoutButton.addEventListener(

      "click",

      async () => {

        logoutButton.disabled = true;

        logoutButton.textContent = "처리 중...";

        try {

          const { error } =

            await supabaseClient.auth.signOut();

          if (error) {

            throw error;

          }

          await moveToLogin();

        } catch (error) {

          console.error(error);

          showError(

            error.message ||

            "로그아웃 중 오류가 발생했습니다."

          );

          logoutButton.disabled = false;

          logoutButton.textContent = "로그아웃";

        }

      }

    );

    protectAdminPage();

  </script>
