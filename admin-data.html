<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>데이터 관리</title>


<style>

body {
  font-family: Arial, sans-serif;
  background:#f7f7f7;
  margin:0;
  padding:20px;
}


header {
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}


.box {
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}


h2 {
  margin-top:0;
}


h3 {
  margin-top:0;
}


.card {
  background:#fafafa;
  border:1px solid #eee;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}


button {

  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #ddd;
  background:white;
  font-size:16px;

}


.small {

  color:#777;
  font-size:14px;

}


.money {

  font-size:22px;
  font-weight:bold;

}


</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

</head>


<body>



<header>

<h2>📊 데이터 관리</h2>

<p>
운영 기록과 데이터를 관리합니다.
</p>

</header>




<div class="box">

<h3>📒 영업 마감 기록</h3>

<div id="closingList">

불러오는 중입니다...

</div>

</div>



<div class="box">

<h3>👥 고객 데이터</h3>

<p>
준비 중입니다.
</p>

</div>



<div class="box">

<h3>📈 판매 분석</h3>

<p>
분석 기간을 선택해 상품·지역별 판매 데이터를 확인합니다.
</p>

<button>
분석하기
</button>

</div>

<script>


async function loadClosingData() {

  const { data: closings, error } = await supabaseClient
    .from("daily_closings")
    .select("*")
    .order("closing_date", {
      ascending:false
    })
    .limit(30);


  const box = document.getElementById("closingList");


  if(error){

    console.error(error);

    box.innerHTML =
      "마감 기록을 불러오지 못했습니다.";

    return;

  }


  if(!closings || closings.length === 0){

    box.innerHTML =
      "아직 저장된 마감 기록이 없습니다.";

    return;

  }


  box.innerHTML = "";


  for (const closing of closings) {


    const { data: deliveries, error: deliveryError } =
      await supabaseClient
        .from("delivery_logs")
        .select("*")
        .eq(
          "delivery_date",
          closing.closing_date
        )
        .order("created_at", {
          ascending:true
        });



    let deliveryHtml = "";


    if(deliveries && deliveries.length > 0){


      deliveryHtml = deliveries.map(item => {


        let productText = "";


        try {

          const products =
            JSON.parse(item.products || "[]");


          productText =
            products
            .map(product =>
              `${product.product_name || ""} ${product.quantity || 0}개`
            )
            .join("<br>");


        } catch(e){

          productText = "";

        }



        return `

        <div class="card">

          주문번호
          ${item.order_id || "-"}

          <br><br>

          📍
          ${item.delivery_address || "-"}

          <br>

          ☎
          ${item.customer_phone || "-"}

          <br><br>

          🥩
          ${productText || "-"}

          <br><br>

          💰
          ${Number(item.total_amount || 0)
          .toLocaleString()}원


        </div>

        `;


      }).join("");


    } else {


      deliveryHtml =
      "배송 상세 기록이 없습니다.";


    }



    box.innerHTML += `


    <div class="card">


      <h3>
      📁 ${closing.closing_date} 영업 마감
      </h3>


      <p>
      매출 :
      ${Number(closing.total_sales || 0)
      .toLocaleString()}원
      </p>


      <p>
      배송 :
      ${closing.delivery_count || 0}건
      </p>



      <button
      onclick="
      this.nextElementSibling.style.display =
      this.nextElementSibling.style.display === 'block'
      ? 'none'
      : 'block'
      "
      >

      기록 보기

      </button>



      <div style="display:none; margin-top:15px;">


      ${deliveryHtml}


      </div>



    </div>


    `;


  }


}



loadClosingData();



</script>


</body>

</html>
