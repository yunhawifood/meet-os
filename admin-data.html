<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>데이터 관리</title>


<style>

body {
  font-family: Arial, sans-serif;
  background:#f7f7f7;
  margin:0;
  padding:20px;
}


header {
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}


.box {
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}


h2 {
  margin-top:0;
}


h3 {
  margin-top:0;
}


.card {
  background:#fafafa;
  border:1px solid #eee;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}


button {

  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #ddd;
  background:white;
  font-size:16px;
  color:#222;

}


.small {

  color:#777;
  font-size:14px;

}


.money {

  font-size:22px;
  font-weight:bold;

}


</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

</head>


<body>



<header>

<h2>📊 데이터 관리</h2>

<p>
운영 기록과 데이터를 관리합니다.
</p>

</header>




<div class="box">

<h3>📒 영업 마감 기록</h3>

<div id="closingList">

불러오는 중입니다...

</div>

</div>



<div class="box">

<h3>👥 고객 데이터</h3>

<p>
준비 중입니다.
</p>

</div>


<div class="box">

<h3>📈 판매 분석</h3>

<p>
기간을 선택해 판매 데이터를 확인합니다.
</p>


<div>

<div style="
display:flex;
gap:10px;
">

<div style="flex:1;">
<label>시작일</label>
<input
id="analysisStart"
type="date">
</div>


<div style="flex:1;">
<label>종료일</label>
<input
id="analysisEnd"
type="date">
</div>

</div>

</div>


<br>


<button onclick="loadSalesAnalysis()">
분석하기
</button>


<hr>


<div id="salesAnalysis">

</div>


</div>

<script>

async function loadClosingData() {

  const { data, error } = await supabaseClient
    .from("daily_closings")
    .select("*")
    .order("closing_date", {
      ascending:false
    });


  const box =
    document.getElementById("closingList");


  if(error){

    console.error(error);

    box.innerHTML =
      "마감 기록을 불러오지 못했습니다.";

    return;

  }


  if(!data || data.length === 0){

    box.innerHTML =
      "아직 저장된 마감 기록이 없습니다.";

    return;

  }


  const grouped = {};


  data.forEach(item => {


    const month =
      item.closing_date.substring(0,7);


    if(!grouped[month]){

      grouped[month] = [];

    }


    grouped[month].push(item);


  });



  box.innerHTML = "";



  Object.keys(grouped).forEach(month => {


    const monthCount =
      grouped[month].length;


    const monthSales =
      grouped[month].reduce(
        (sum,item)=>
        sum + (item.total_sales || 0),
        0
      );


    box.innerHTML += `


    <div class="card">


      <h3>
      📁 ${month} 장부
      </h3>


      <p>
      마감 기록 ${monthCount}건
      </p>


      <p>
      총 매출
      ${Number(monthSales)
      .toLocaleString()}원
      </p>


 <button
onclick="showMonthBook('${month}')"
>
장부 열기
</button>
    </div>


    `;


  });


}

async function showMonthBook(month){

  const startDate = `${month}-01`;

const endDate = `${month}-31`;


const { data, error } = await supabaseClient
    .from("daily_closings")
    .select("*")
    .gte("closing_date", startDate)
    .lte("closing_date", endDate)
    .order("closing_date", {
      ascending:false
    });

  const box =
    document.getElementById("closingList");



  if(error){

    console.error(error);

    box.innerHTML =
    "장부를 불러오지 못했습니다.";

    return;

  }



  if(!data || data.length === 0){

    box.innerHTML =
    "해당 월 기록이 없습니다.";

    return;

  }



  box.innerHTML = `

  <button onclick="loadClosingData()">
  ← 처음으로
  </button>

  <br><br>


  <h3>
  📅 ${month} 날짜별 기록
  </h3>


  `;



  data.forEach(item=>{


    box.innerHTML += `


    <div class="card">


    <h3>
    📄 ${item.closing_date} 영업 마감
    </h3>


    <p>
    매출 :
    ${Number(item.total_sales || 0)
    .toLocaleString()}원
    </p>


    <p>
    배송 :
    ${item.delivery_count || 0}건
    </p>


    <button
    onclick="showDayBook('${item.closing_date}')"
    >

    배송 기록 보기

    </button>


    </div>


    `;


  });


}
async function showDayBook(date){

console.log("찾는 날짜:", date);
const { data, error } = await supabaseClient
  .from("delivery_logs")
  .select("*")
  .eq("delivery_date", date)
  .order("created_at", {
    ascending:false
  });



const box =
document.getElementById("closingList");



if(error){

 console.error(error);

 box.innerHTML =
 "배송 기록을 불러오지 못했습니다.";

 return;

}



if(!data || data.length === 0){

box.innerHTML = `

<button onclick="showMonthBook('${date.substring(0,7)}')">
← 날짜별 기록으로
</button>

<h3>
🚚 ${date} 배송 기록
</h3>

`;
 return;

}



box.innerHTML = `

<button onclick="showMonthBook('${date.substring(0,7)}')">
← 날짜별 기록으로
</button>
<h3>
🚚 ${date} 배송 기록
</h3>

`;



data.forEach(item=>{


let products="";


try{

const list =
JSON.parse(item.products || "[]");


products =
list.map(product =>
`${product.product_name || ""} ${product.quantity || 0}개`
).join("<br>");


}catch(e){

products="";

}



box.innerHTML += `

<div class="card">


<h3>
📄 주문번호
${item.order_id || ""}
</h3>


<p>
📍 ${item.delivery_address || ""}
</p>


<p>
☎ ${item.customer_phone || ""}
</p>


<p>
🥩 ${products}
</p>


<p>
💰 ${Number(item.total_amount || 0)
.toLocaleString()}원
</p>


<p class="small">
배송시간 :
${new Date(item.created_at)
.toLocaleString()}
</p>


</div>

`;


});


}
async function loadSalesAnalysis(){

const box =
document.getElementById("salesAnalysis");

const start =
document.getElementById("analysisStart").value;


const end =
document.getElementById("analysisEnd").value;


const { data, error } = await supabaseClient
.from("orders")
.select(`
  total_amount,
  created_at,
  delivery_address_main,
  order_items (
    product_name,
    quantity
  )
`)
.gte(
  "created_at",
  start + "T00:00:00"
)
.lte(
  "created_at",
  end + "T23:59:59"
);

if(error){

console.error(error);

box.innerHTML =
"판매 분석 데이터를 불러오지 못했습니다.";

return;

}


if(!data || data.length === 0){

box.innerHTML =
"분석할 주문 데이터가 없습니다.";

return;

}



const totalCount =
data.length;


const totalSales =
data.reduce(
(sum,item)=>
sum + Number(item.total_amount || 0),
0
);



const areaCount = {};

const timeCount = {
  "09~12시":0,
  "12~15시":0,
  "15~18시":0,
  "18~21시":0
};


const productCount = {};



data.forEach(item=>{


// 지역 분석

const area =
item.delivery_address_main || "매장 주문";


if(!areaCount[area]){

areaCount[area]=0;

}


areaCount[area]++;



// 주문 시간 분석

const orderDate =
new Date(item.created_at);


const hour =
orderDate.getHours();


if(hour >= 9 && hour < 12){

timeCount["09~12시"]++;

}
else if(hour >= 12 && hour < 15){

timeCount["12~15시"]++;

}
else if(hour >= 15 && hour < 18){

timeCount["15~18시"]++;

}
else if(hour >= 18 && hour < 21){

timeCount["18~21시"]++;

}



// 상품 분석

if(item.order_items){

item.order_items.forEach(product=>{


const name =
product.product_name || "상품명 없음";


if(!productCount[name]){

productCount[name]=0;

}


productCount[name] +=
Number(product.quantity || 0);


});

}


});





let areaHtml="";


Object.keys(areaCount).forEach(area=>{

areaHtml +=
`
<p>
📍 ${area}
: ${areaCount[area]}건
</p>
`;

});




let timeHtml="";


Object.keys(timeCount).forEach(time=>{

timeHtml +=
`
<p>
⏰ ${time}
: ${timeCount[time]}건
</p>
`;

});




let productHtml="";


Object.keys(productCount).forEach(product=>{

productHtml +=
`
<p>
🥩 ${product}
: ${productCount[product]}개
</p>
`;

});




box.innerHTML = `

<button onclick="location.reload()">
← 처음으로
</button>
<br><br>

<h4>
전체 현황
</h4>


<p>
주문 :
${totalCount}건
</p>


<p>
매출 :
${totalSales.toLocaleString()}원
</p>


<hr>


<h4>
⏰ 주문 시간 분석
</h4>

${timeHtml}


<hr>


<h4>
🥩 상품별 판매
</h4>

${productHtml}


<hr>


<h4>
📍 지역별 주문
</h4>


${areaHtml}



`;

}
window.onload = function(){

const today =
new Date()
.toISOString()
.slice(0,10);


document.getElementById("analysisEnd").value =
today;


document.getElementById("analysisStart").value =
today;

};
loadClosingData();



</script>


</body>

</html>
