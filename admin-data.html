<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>데이터 관리</title>


<style>

body {
  font-family: Arial, sans-serif;
  background:#f7f7f7;
  margin:0;
  padding:20px;
}


header {
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}


.box {
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}


h2 {
  margin-top:0;
}


h3 {
  margin-top:0;
}


.card {
  background:#fafafa;
  border:1px solid #eee;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
}


button {

  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #ddd;
  background:white;
  font-size:16px;

}


.small {

  color:#777;
  font-size:14px;

}


.money {

  font-size:22px;
  font-weight:bold;

}


</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

</head>


<body>



<header>

<h2>📊 데이터 관리</h2>

<p>
운영 기록과 데이터를 관리합니다.
</p>

</header>




<div class="box">

<h3>📒 영업 마감 기록</h3>

<div id="closingList">

불러오는 중입니다...

</div>

</div>





<div class="box">

<h3>🚚 배송 기록</h3>

<div id="deliveryList">

불러오는 중입니다...

</div>

</div>





<div class="box">

<h3>👥 고객 데이터</h3>

<p>
준비 중입니다.
</p>

</div>




<div class="box">

<h3>📈 판매 분석</h3>

<p>
준비 중입니다.
</p>

</div>

<script>


async function loadClosingData() {


  const { data, error } = await supabaseClient
    .from("daily_closings")
    .select("*")
    .order("closing_date", {
      ascending:false
    })
    .limit(10);



  const box = document.getElementById("closingList");



  if(error){

    console.error(error);

    box.innerHTML =
      "마감 기록을 불러오지 못했습니다.";

    return;

  }



  if(!data || data.length === 0){

    box.innerHTML =
      "아직 저장된 마감 기록이 없습니다.";

    return;

  }

  box.innerHTML = "";


data.forEach(item => {


  box.innerHTML += `
<div class="card">

  <h3>
    📒 ${item.closing_date} 영업 마감
  </h3>


  <p>
    매출 : ${Number(item.total_sales || 0).toLocaleString()}원
  </p>


  <p>
    아침배송 : ${item.delivery_count || 0}건
  </p>


  <button
    onclick="this.nextElementSibling.style.display =
    this.nextElementSibling.style.display === 'block'
    ? 'none'
    : 'block'"
  >
    상세보기
  </button>


  <div style="display:none; margin-top:15px;">

    <p>
      특이사항 :
      ${item.memo || "없음"}
    </p>


    <p>
      내일 준비사항 :
      ${item.tomorrow_note || "없음"}
    </p>

  </div>


</div>

`;

  });

}


async function loadDeliveryData(){



  const { data, error } = await supabaseClient
    .from("delivery_logs")
    .select("*")
    .order("created_at", {
      ascending:false
    })
    .limit(20);

console.log("delivery data:", data);
console.log("delivery error:", error);


  const box =
    document.getElementById("deliveryList");



  if(error){

    console.error(error);

    box.innerHTML =
      "배송 기록을 불러오지 못했습니다.";

    return;

  }




  if(!data || data.length === 0){

    box.innerHTML =
      "아직 저장된 배송 기록이 없습니다.";

    return;

  }

  box.innerHTML = "";
const grouped = {};

data.forEach(item => {

  const date = item.created_at
    ? new Date(item.created_at).toLocaleDateString()
    : "날짜 없음";


  if(!grouped[date]){
    grouped[date] = [];
  }


  grouped[date].push(item);

});


Object.keys(grouped).forEach(date => {


  box.innerHTML += `

    <div class="card">

      <h3>
        📁 ${date} 배송 장부
      </h3>


      <p>
        배송 건수 :
        ${grouped[date].length}건
      </p>


      <button
        onclick="
        this.nextElementSibling.style.display =
        this.nextElementSibling.style.display === 'block'
        ? 'none'
        : 'block'
        "
      >
        상세 보기
      </button>


      <div style="display:none; margin-top:15px;">


        ${
          grouped[date].map(item => `

            <p>
              📍 ${item.delivery_address || ""}
              <br>
              ☎ ${item.customer_phone || ""}
              <br>
              ${Number(item.total_amount || 0).toLocaleString()}원
            </p>

          `).join("")
        }


      </div>

    </div>

  `;


});

}


loadClosingData();

loadDeliveryData();



</script>


</body>

</html>
