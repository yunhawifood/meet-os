<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>데이터 관리</title>


<style>

:root {
  --green:#235f3f;
  --green-deep:#194a30;
  --soft:#eef7f1;
  --line:#e3e7e4;
  --muted:#69716c;
  --surface:#ffffff;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:#f4f6f5;
  color:#1b1e1c;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

.page {
  width:min(100%,1080px);
  margin:0 auto;
  padding:24px 18px 80px;
}

.top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  margin-bottom:20px;
}

.brand h1 {
  margin:0;
  color:var(--green);
  font-size:26px;
  letter-spacing:-0.04em;
}

.brand p {
  margin:6px 0 0;
  color:var(--muted);
  font-size:14px;
}

.top-actions {
  display:flex;
  align-items:center;
  gap:8px;
}

.back,
.secondary {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:46px;
  padding:0 16px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  color:#3f4843;
  font:inherit;
  font-weight:800;
  text-decoration:none;
  cursor:pointer;
}

.panel {
  padding:20px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--surface);
  box-shadow:0 8px 25px rgba(0,0,0,.04);
}

.intro-panel {
  margin-bottom:18px;
}

.intro-panel p {
  margin:0;
  color:var(--muted);
  line-height:1.6;
}

.connection-message {
  margin-top:14px;
  padding:13px 15px;
  border-radius:12px;
  background:#f3f5f4;
  color:#4f5853;
}

.tabs {
  display:flex;
  gap:8px;
  margin:18px 0;
  overflow-x:auto;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar {
  display:none;
}

.tab {
  display:inline-flex;
  align-items:center;
  min-height:46px;
  padding:0 16px;
  border-radius:12px;
  background:#e7ece9;
  color:#3e4943;
  font-weight:800;
  text-decoration:none;
  white-space:nowrap;
}

.tab.active {
  background:var(--green);
  color:#fff;
}

.dashboard-grid {
  display:grid;
  grid-template-columns:minmax(0,1.65fr) minmax(260px,.85fr);
  gap:16px;
  align-items:start;
}

.box {
  min-width:0;
  padding:24px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--surface);
  box-shadow:0 8px 25px rgba(0,0,0,.04);
}

.box.wide {
  grid-column:1/-1;
}

.section-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.section-head h2 {
  margin:0;
  font-size:21px;
  letter-spacing:-0.03em;
}

.status {
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  background:var(--soft);
  color:var(--green);
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.section-copy {
  margin:0 0 18px;
  color:var(--muted);
  line-height:1.65;
}

h2 {
  margin-top:0;
}


h3 {
  margin-top:0;
}


.card {
  margin-top:12px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fbfcfb;
  overflow-wrap:anywhere;
}

.card h3 {
  margin:0 0 10px;
  color:var(--green);
  font-size:17px;
}

.card p {
  margin:8px 0;
  line-height:1.55;
}

button {
  min-height:46px;
  padding:0 16px;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:#fff;
  font:inherit;
  font-weight:800;
  cursor:pointer;
}

button:hover {
  background:var(--green-deep);
}

button:focus-visible,
.back:focus-visible,
.tab:focus-visible,
input:focus-visible {
  outline:3px solid rgba(47,139,80,.18);
  outline-offset:2px;
}

.card button {
  width:100%;
  margin-top:8px;
}

.date-fields {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-bottom:14px;
}

.field {
  display:grid;
  gap:7px;
}

label {
  color:#59635d;
  font-size:14px;
  font-weight:800;
}

input {
  width:100%;
  min-height:48px;
  padding:0 13px;
  border:1px solid #d7ddd9;
  border-radius:12px;
  background:#fff;
  color:#1b1e1c;
  font:inherit;
}

.primary-action {
  width:100%;
}

#closingList,
#salesAnalysis {
  color:#3f4843;
  line-height:1.6;
}

#salesAnalysis:not(:empty) {
  margin-top:16px;
  padding:18px;
  border-radius:16px;
  background:var(--soft);
}

#salesAnalysis h4 {
  margin:16px 0 8px;
  color:var(--green);
  font-size:17px;
}

#salesAnalysis h4:first-of-type {
  margin-top:0;
}

#salesAnalysis hr {
  margin:18px 0;
  border:0;
  border-top:1px solid #d8e6dc;
}

.small {
  color:var(--muted);
  font-size:14px;
}


.money {

  font-size:22px;
  font-weight:bold;

}

@media (max-width:720px) {
  .page {
    padding:18px 14px 60px;
  }

  .top {
    align-items:flex-start;
    flex-direction:column;
  }

  .top-actions {
    width:100%;
  }

  .top-actions > * {
    flex:1;
  }

  .dashboard-grid,
  .date-fields {
    grid-template-columns:1fr;
  }

  .box.wide {
    grid-column:auto;
  }

  .box {
    padding:20px 16px;
  }

  .section-head {
    align-items:flex-start;
  }
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

</head>


<body>

<main class="page">

<header class="top">

<div class="brand">
<h1>한농직판장 관리자 OS</h1>
<p>영업 마감 · 고객 데이터 · 판매 분석</p>
</div>

<div class="top-actions">
<a class="back" href="./admin-dashboard.html">관리자 홈</a>
<button class="secondary" type="button" onclick="location.reload()">새로고침</button>
</div>

</header>

<section class="panel intro-panel">
<p>Supabase 관리자 로그인 상태로 운영 기록과 데이터를 확인합니다.</p>
<div class="connection-message">필요한 항목을 선택해 운영 데이터를 확인하세요.</div>
</section>

<nav class="tabs" aria-label="데이터 관리 메뉴">
<a class="tab active" href="#closingSection">영업 마감 기록</a>
<a class="tab" href="#customerSection">고객 데이터</a>
<a class="tab" href="#analysisSection">판매 분석</a>
</nav>

<div class="dashboard-grid">

<section class="box" id="closingSection">

<div class="section-head">
<h2>영업 마감 기록</h2>
<span class="status">월별 장부</span>
</div>

<div id="closingList">

불러오는 중입니다...

</div>

</section>



<section class="box" id="customerSection">

<div class="section-head">
<h2>고객 데이터</h2>
<span class="status">준비 중</span>
</div>

<p class="section-copy">
준비 중입니다.
</p>

</section>


<section class="box wide" id="analysisSection">

<div class="section-head">
<h2>판매 분석</h2>
<span class="status">기간별 조회</span>
</div>

<p class="section-copy">
기간을 선택해 판매 데이터를 확인합니다.
</p>


<div class="date-fields">

<div class="field">
<label for="analysisStart">시작일</label>
<input
id="analysisStart"
type="date">
</div>


<div class="field">
<label for="analysisEnd">종료일</label>
<input
id="analysisEnd"
type="date">
</div>

</div>

<button class="primary-action" type="button" onclick="loadSalesAnalysis()">
분석하기
</button>


<div id="salesAnalysis">

</div>


</section>

</div>

</main>

<script>

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

function isValidMonth(value) {
  return /^\d{4}-\d{2}$/.test(String(value || ""));
}

function isValidDate(value) {
  return /^\d{4}-\d{2}-\d{2}$/.test(String(value || ""));
}

function handleDataAction(event) {

  const button = event.target.closest(
    "button[data-action]"
  );

  if (
    !button ||
    !event.currentTarget.contains(button)
  ) {
    return;
  }

  const action = button.dataset.action;

  if (action === "load-closing") {
    void loadClosingData();
    return;
  }

  if (action === "show-month") {
    void showMonthBook(button.dataset.month || "");
    return;
  }

  if (action === "show-day") {
    void showDayBook(button.dataset.date || "");
    return;
  }

  if (action === "reload") {
    location.reload();
  }

}

document
  .getElementById("closingList")
  .addEventListener("click", handleDataAction);

document
  .getElementById("salesAnalysis")
  .addEventListener("click", handleDataAction);

async function loadClosingData() {

  const { data, error } = await supabaseClient
    .from("daily_closings")
    .select("*")
    .order("closing_date", {
      ascending:false
    });


  const box =
    document.getElementById("closingList");


  if(error){

    console.error(error);

    box.innerHTML =
      "마감 기록을 불러오지 못했습니다.";

    return;

  }


  if(!data || data.length === 0){

    box.innerHTML =
      "아직 저장된 마감 기록이 없습니다.";

    return;

  }


  const grouped = {};


  data.forEach(item => {


    const month =
      String(item.closing_date || "")
        .substring(0,7);


    if (!isValidMonth(month)) {
      return;
    }


    if(!grouped[month]){

      grouped[month] = [];

    }


    grouped[month].push(item);


  });



  box.innerHTML = "";



  Object.keys(grouped).forEach(month => {


    const monthCount =
      grouped[month].length;


    const monthSales =
      grouped[month].reduce(
        (sum,item)=>
        sum + (item.total_sales || 0),
        0
      );


    box.innerHTML += `


    <div class="card">


      <h3>
      ${escapeHtml(month)} 장부
      </h3>


      <p>
      마감 기록 ${monthCount}건
      </p>


      <p>
      총 매출
      ${Number(monthSales)
      .toLocaleString()}원
      </p>


 <button
type="button"
data-action="show-month"
data-month="${escapeHtml(month)}"
>
장부 열기
</button>
    </div>


    `;


  });


}

async function showMonthBook(month){

  if (!isValidMonth(month)) {
    document.getElementById("closingList").textContent =
      "장부 기간을 확인할 수 없습니다.";
    return;
  }

  const startDate = `${month}-01`;

const endDate = `${month}-31`;


const { data, error } = await supabaseClient
    .from("daily_closings")
    .select("*")
    .gte("closing_date", startDate)
    .lte("closing_date", endDate)
    .order("closing_date", {
      ascending:false
    });

  const box =
    document.getElementById("closingList");



  if(error){

    console.error(error);

    box.innerHTML =
    "장부를 불러오지 못했습니다.";

    return;

  }



  if(!data || data.length === 0){

    box.innerHTML =
    "해당 월 기록이 없습니다.";

    return;

  }



  box.innerHTML = `

  <button type="button" data-action="load-closing">
  ← 처음으로
  </button>

  <br><br>


  <h3>
  ${escapeHtml(month)} 날짜별 기록
  </h3>


  `;



  data.forEach(item=>{

    const closingDate =
      String(item.closing_date || "");

    if (!isValidDate(closingDate)) {
      return;
    }


    box.innerHTML += `


    <div class="card">


    <h3>
    ${escapeHtml(closingDate)} 영업 마감
    </h3>


    <p>
    매출 :
    ${Number(item.total_sales || 0)
    .toLocaleString()}원
    </p>


    <p>
    배송 :
    ${item.delivery_count || 0}건
    </p>


    <button
    type="button"
    data-action="show-day"
    data-date="${escapeHtml(closingDate)}"
    >

    배송 기록 보기

    </button>


    </div>


    `;


  });


}
async function showDayBook(date){

if (!isValidDate(date)) {
  document.getElementById("closingList").textContent =
    "배송 기록 날짜를 확인할 수 없습니다.";
  return;
}

console.log("찾는 날짜:", date);
const { data, error } = await supabaseClient
  .from("delivery_logs")
  .select("*")
  .eq("delivery_date", date)
  .order("created_at", {
    ascending:false
  });



const box =
document.getElementById("closingList");



if(error){

 console.error(error);

 box.innerHTML =
 "배송 기록을 불러오지 못했습니다.";

 return;

}



if(!data || data.length === 0){

box.innerHTML = `

<button
type="button"
data-action="show-month"
data-month="${escapeHtml(date.substring(0,7))}">
← 날짜별 기록으로
</button>

<h3>
${escapeHtml(date)} 배송 기록
</h3>

`;
 return;

}



box.innerHTML = `

<button
type="button"
data-action="show-month"
data-month="${escapeHtml(date.substring(0,7))}">
← 날짜별 기록으로
</button>
<h3>
${escapeHtml(date)} 배송 기록
</h3>

`;



data.forEach(item=>{


let products="";


try{

const list =
JSON.parse(item.products || "[]");


products =
list.map(product =>
`${escapeHtml(product.product_name || "")} ${Number(product.quantity || 0)}개`
).join("<br>");


}catch(e){

products="";

}



box.innerHTML += `

<div class="card">


<h3>
주문번호
${escapeHtml(item.order_id || "")}
</h3>


<p>
배송지 · ${escapeHtml(item.delivery_address || "")}
</p>


<p>
전화번호 · ${escapeHtml(item.customer_phone || "")}
</p>


<p>
상품<br>${products}
</p>


<p>
💰 ${Number(item.total_amount || 0)
.toLocaleString()}원
</p>


<p class="small">
배송시간 :
${escapeHtml(
  new Date(item.created_at)
    .toLocaleString("ko-KR")
)}
</p>


</div>

`;


});


}
async function loadSalesAnalysis(){

const box =
document.getElementById("salesAnalysis");

const start =
document.getElementById("analysisStart").value;


const end =
document.getElementById("analysisEnd").value;


const { data, error } = await supabaseClient
.from("orders")
.select(`
  total_amount,
  created_at,
  delivery_address_main,
  order_items (
    product_name,
    quantity
  )
`)
.gte(
  "created_at",
  start + "T00:00:00"
)
.lte(
  "created_at",
  end + "T23:59:59"
);

if(error){

console.error(error);

box.innerHTML =
"판매 분석 데이터를 불러오지 못했습니다.";

return;

}


if(!data || data.length === 0){

box.innerHTML =
"분석할 주문 데이터가 없습니다.";

return;

}



const totalCount =
data.length;


const totalSales =
data.reduce(
(sum,item)=>
sum + Number(item.total_amount || 0),
0
);



const areaCount = {};

const timeCount = {
  "09~12시":0,
  "12~15시":0,
  "15~18시":0,
  "18~21시":0
};


const productCount = {};



data.forEach(item=>{


// 지역 분석

const area =
item.delivery_address_main || "매장 주문";


if(!areaCount[area]){

areaCount[area]=0;

}


areaCount[area]++;



// 주문 시간 분석

const orderDate =
new Date(item.created_at);


const hour =
orderDate.getHours();


if(hour >= 9 && hour < 12){

timeCount["09~12시"]++;

}
else if(hour >= 12 && hour < 15){

timeCount["12~15시"]++;

}
else if(hour >= 15 && hour < 18){

timeCount["15~18시"]++;

}
else if(hour >= 18 && hour < 21){

timeCount["18~21시"]++;

}



// 상품 분석

if(item.order_items){

item.order_items.forEach(product=>{


const name =
product.product_name || "상품명 없음";


if(!productCount[name]){

productCount[name]=0;

}


productCount[name] +=
Number(product.quantity || 0);


});

}


});





let areaHtml="";


Object.keys(areaCount).forEach(area=>{

areaHtml +=
`
<p>
${escapeHtml(area)}
: ${areaCount[area]}건
</p>
`;

});




let timeHtml="";


Object.keys(timeCount).forEach(time=>{

timeHtml +=
`
<p>
⏰ ${time}
: ${timeCount[time]}건
</p>
`;

});




let productHtml="";


Object.keys(productCount).forEach(product=>{

productHtml +=
`
<p>
${escapeHtml(product)}
: ${productCount[product]}개
</p>
`;

});




box.innerHTML = `

<button type="button" data-action="reload">
← 처음으로
</button>
<br><br>

<h4>
전체 현황
</h4>


<p>
주문 :
${totalCount}건
</p>


<p>
매출 :
${totalSales.toLocaleString()}원
</p>


<hr>


<h4>
⏰ 주문 시간 분석
</h4>

${timeHtml}


<hr>


<h4>
🥩 상품별 판매
</h4>

${productHtml}


<hr>


<h4>
📍 지역별 주문
</h4>


${areaHtml}



`;

}
window.onload = function(){

const today =
new Date()
.toISOString()
.slice(0,10);


document.getElementById("analysisEnd").value =
today;


document.getElementById("analysisStart").value =
today;

};
loadClosingData();



</script>


</body>

</html>
