<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>데이터 관리</title>

<style>

body {
  font-family: Arial, sans-serif;
  background:#f7f7f7;
  margin:0;
  padding:20px;
}

header {
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}

.box {
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}

button {
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid #ddd;
  background:white;
  font-size:16px;
}

</style>

</head>


<body>


<header>

<h2>📊 데이터 관리</h2>

<p>
운영 기록과 데이터를 관리합니다.
</p>

</header>



<div class="box">

<h3>🚚 배송 기록</h3>

<p>
아직 저장된 배송 기록이 없습니다.
</p>


<button>
배송 기록 보기
</button>


</div>



<div class="box">

<h3>👥 고객 데이터</h3>

<p>
준비 중입니다.
</p>

</div>



<div class="box">

<h3>📈 판매 분석</h3>

<p>
준비 중입니다.
</p>

</div>


</body>

</html>
