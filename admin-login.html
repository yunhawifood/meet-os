<!doctype html>

<html lang="ko">

<head>

  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="robots" content="noindex, nofollow" />

  <title>한농직판장 운영 OS</title>

  <style>

    * {

      box-sizing: border-box;

    }

    html,

    body {

      margin: 0;

      min-height: 100%;

      font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Apple SD Gothic Neo",

        "Noto Sans KR",

        sans-serif;

      background: #f5f5f3;

      color: #191919;

    }

    body {

      min-height: 100vh;

      min-height: 100dvh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;

    }

    .login-card {

      width: 100%;

      max-width: 420px;

      padding: 34px 26px 28px;

      background: #ffffff;

      border: 1px solid #e7e7e2;

      border-radius: 24px;

      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.08);

    }

    .brand {

      margin-bottom: 30px;

      text-align: center;

    }

    .brand-mark {

      width: 58px;

      height: 58px;

      margin: 0 auto 16px;

      display: grid;

      place-items: center;

      border-radius: 18px;

      background: #b62323;

      color: #ffffff;

      font-size: 27px;

      font-weight: 800;

    }

    h1 {

      margin: 0;

      font-size: 25px;

      line-height: 1.3;

      letter-spacing: -0.04em;

    }

    .subtitle {

      margin: 9px 0 0;

      color: #777;

      font-size: 14px;

      line-height: 1.55;

    }

    .field {

      margin-top: 18px;

    }

    label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 700;

    }

    input {

      width: 100%;

      height: 54px;

      padding: 0 15px;

      border: 1px solid #d8d8d3;

      border-radius: 14px;

      background: #ffffff;

      color: #191919;

      font-size: 16px;

      outline: none;

      transition:

        border-color 0.2s,

        box-shadow 0.2s;

    }

    input:focus {

      border-color: #b62323;

      box-shadow: 0 0 0 4px rgba(182, 35, 35, 0.1);

    }

    button {

      width: 100%;

      height: 56px;

      margin-top: 24px;

      border: 0;

      border-radius: 15px;

      background: #b62323;

      color: #ffffff;

      font-size: 17px;

      font-weight: 800;

      cursor: pointer;

    }

    button:disabled {

      cursor: not-allowed;

      opacity: 0.6;

    }

    .message {

      display: none;

      margin-top: 16px;

      padding: 12px 14px;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.5;

    }

    .message.error {

      display: block;

      background: #fff0f0;

      color: #a51d1d;

    }

    .message.success {

      display: block;

      background: #eef9f1;

      color: #23743a;

    }

    .security-note {

      margin: 20px 0 0;

      text-align: center;

      color: #999;

      font-size: 12px;

      line-height: 1.5;

    }

  </style>

</head>

<body>

  <main class="login-card">

    <div class="brand">

      <div class="brand-mark">한</div>

      <h1>한농직판장 운영 OS</h1>

      <p class="subtitle">승인된 관리자만 접속할 수 있습니다.</p>

    </div>

    <form id="loginForm">

      <div class="field">

        <label for="email">관리자 이메일</label>

        <input

          id="email"

          name="email"

          type="email"

          autocomplete="username"

          required

        />

      </div>

      <div class="field">

        <label for="password">비밀번호</label>

        <input

          id="password"

          name="password"

          type="password"

          autocomplete="current-password"

          required

        />

      </div>

      <button id="loginButton" type="submit">로그인</button>

      <div id="message" class="message" role="alert"></div>

    </form>

    <p class="security-note">

      고객용 회원가입 화면은 제공하지 않습니다.

    </p>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

  const SUPABASE_URL = "NEXT_PUBLIC_SUPABASE_URL=https://rbtwvemljpgnwhlzayqy.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY = "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_m-Uc3eR2-57P36HMP_eHsQ_F5h1tfzu";

  const supabaseClient = window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY

  );
    const loginForm = document.getElementById("loginForm");

    const loginButton = document.getElementById("loginButton");

    const message = document.getElementById("message");

    function showMessage(text, type) {

      message.textContent = text;

      message.className = `message ${type}`;

    }

    async function checkExistingSession() {

      const {

        data: { session },

        error

     } = await supabaseClient.auth.getSession();
      if (error || !session) {

        return;

      }

      const { data: admin, error: adminError } =

        await supabaseClient

  .from("admin_users")          
        .select("user_id, is_active")

          .eq("user_id", session.user.id)

          .eq("is_active", true)

          .maybeSingle();

      if (!adminError && admin) {

        window.location.replace("./admin-dashboard.html");

      }

    }

    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      const password = document.getElementById("password").value;

      loginButton.disabled = true;

      loginButton.textContent = "확인 중...";

      message.className = "message";

      try {

        const { data, error } =

          await window.supabaseClient.auth.signInWithPassword({

            email,

            password

          });

        if (error) {

          throw error;

        }

        const { data: admin, error: adminError } =

          await window.supabaseClient

            .from("admin_users")

            .select("user_id, display_name, role, is_active")

            .eq("user_id", data.user.id)

            .eq("is_active", true)

            .maybeSingle();

        if (adminError || !admin) {

          await window.supabaseClient.auth.signOut();

          throw new Error("관리자 권한이 등록되지 않은 계정입니다.");

        }

        showMessage("로그인되었습니다. 관리자 화면으로 이동합니다.", "success");

        setTimeout(() => {

          window.location.replace("./admin-dashboard.html");

        }, 500);

      } catch (error) {

        console.error(error);

        showMessage(

          error.message === "Invalid login credentials"

            ? "이메일 또는 비밀번호가 올바르지 않습니다."

            : error.message || "로그인 중 오류가 발생했습니다.",

          "error"

        );

      } finally {

        loginButton.disabled = false;

        loginButton.textContent = "로그인";

      }

    });

    checkExistingSession();

  </script>

</body>

</html>
