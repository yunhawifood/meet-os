<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>배송 지도 | 한농직판장 운영 OS</title>


    <style>
        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #f4f4f4;

            color: #222;

            font-family:

                BlinkMacSystemFont,

        header {

            background: white;

            border-bottom: 1px solid #ddd;

            padding: 16px;

        }


        .header-inner {

            display: flex;

            align-items: center;

            justify-content: space-between;

            max-width: 900px;

            margin: auto;

        }


        button {

            appearance: none;

            -webkit-appearance: none;

            cursor: pointer;

        }


        .back-button,
        .logout-button {
color: #333;

            min-height: 42px;

            padding: 9px 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

        }


        h1 {

            font-size: 21px;

        }


        main {

            width: calc(100% - 32px);

        }



        .section-box {

            border: 1px solid #ddd;

            border-radius: 12px;

            padding: 20px;

        }



        #mapArea {

            height: 420px;

            border: 1px solid #ccc;

            border-radius: 12px;

            overflow: hidden;

            background: #eeeeee;

        }


        .delivery-card {

            padding: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            margin-bottom: 10px;

            background: white;

        }


        .delivery-card strong {

            display: block;

            margin-top: 6px;

        }



        .loading-screen {

            position: fixed;

            inset: 0;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 9999;

        }
    </style>

</head>



<body>


    <div id="loadingScreen" class="loading-screen">

        관리자 권한 확인 중...

    </div>



    <header>

        <div class="header-inner">


            <a class="back-button" href="./admin-orders.html">

                ← 주문 관리

            </a>


            <h1>
                배송 지도
            </h1>



            <button id="logoutButton" class="logout-button">

                로그아웃

            </button>


        </div>

    </header>




    <main>


        <section class="section-box">

            <div class="section-title">

                🗺️ 오늘 배송 지도

            </div>


            <div id="mapArea"></div>


        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=65ebf00207dd007162a893dad6f3f335&libraries=services">
    </script>

    <script src="apartment-coordinates.js"></script>
    <script>


        const SUPABASE_URL =

            "https://rbtwvemljpgnwhlzayqy.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_m-Uc3eR2-57P36HMP_eHsQ_F5h1tfzu";



        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );



        const loadingScreen =
            document.getElementById(
                "loadingScreen"
            );


        function moveToLogin() {

            window.location.replace(
                "./admin-login.html"
            );

        }
async function protectAdminPage() {

    const {
        data: { session },
        error
    } = await supabaseClient.auth.getSession();


    if (error) {

        console.error(error);

        return false;

    }


    if (!session) {

        moveToLogin();

        return false;

    }


    const {
        data: admin,
        error: adminError
    } = await supabaseClient

        .from("admin_users")

        .select(
            "user_id,is_active"
        )

        .eq(
            "user_id",
            session.user.id
        )

        .eq(
            "is_active",
            true
        )

        .maybeSingle();


    if (adminError) {

        console.error(adminError);

        return false;

    }


    if (!admin) {

        await supabaseClient.auth.signOut();

        moveToLogin();

        return false;

    }


    loadingScreen.style.display = "none";


    return true;

}



async function loadDeliveryOrders() {

    const {
        data,
        error
    } = await supabaseClient

        .from("orders")

        .select(`
            *,
            order_items (*)
        `)

        .eq(
            "order_status",
            "received"
        )

        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(
            "배송 조회 오류:",
            error
        );


        const mapArea =
            document.getElementById(
                "mapArea"
            );


        if (mapArea) {

            mapArea.innerHTML =
                `
                <div style="
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    padding:20px;
                    text-align:center;
                    color:#666;
                ">
                    배송 주문을 불러오지 못했습니다.
                </div>
                `;

        }


        return;

    }


    initDeliveryMap(
        data || []
    );

}



let deliveryMarkers = {};



function initDeliveryMap(orders) {

    const mapContainer =
        document.getElementById(
            "mapArea"
        );


    const mapOption = {

        center:
            new kakao.maps.LatLng(
                35.8242,
                127.1480
            ),

        level: 7

    };


    const map =
        new kakao.maps.Map(
            mapContainer,
            mapOption
        );


    map.relayout();


    deliveryMarkers = {};


    if (
        !orders ||
        orders.length === 0
    ) {

        return;

    }


    const geocoder =
        new kakao.maps.services.Geocoder();


    const places =
        new kakao.maps.services.Places();


    const bounds =
        new kakao.maps.LatLngBounds();


    const apartmentGroups = {};


    let markerCount = 0;


    let activeInfoWindow = null;
let activeDetailOverlay = null;



    orders.forEach(
        order => {

            const apartmentName =
                (
                    order.delivery_address_main || ""
                ).trim();


            if (!apartmentName) {

                return;

            }


            if (
                !apartmentGroups[
                    apartmentName
                ]
            ) {

                apartmentGroups[
                    apartmentName
                ] = [];

            }


            apartmentGroups[
                apartmentName
            ].push(
                order
            );

        }
    );



    Object
        .keys(
            apartmentGroups
        )
        .forEach(

            apartmentName => {

                const apartmentOrders =
                    apartmentGroups[
                        apartmentName
                    ];


                const firstOrder =
                    apartmentOrders[0];


                const customCoordinate =
                    getApartmentCoordinate(
                        firstOrder.delivery_address_main,
                        firstOrder.delivery_address_detail
                    );


                if (
                    customCoordinate &&
                    customCoordinate.lat !== null &&
                    customCoordinate.lng !== null
                ) {

                    addMarker(
                        apartmentName,
                        apartmentOrders,
                        customCoordinate.lat,
                        customCoordinate.lng
                    );


                    return;

                }



                geocoder.addressSearch(

                    apartmentName,

                    function (
                        result,
                        status
                    ) {


                        if (
                            status ===
                            kakao.maps.services.Status.OK
                        ) {

                            addMarker(
                                apartmentName,
                                apartmentOrders,
                                result[0].y,
                                result[0].x
                            );


                            return;

                        }



                        places.keywordSearch(

                            "전주 " +
                            apartmentName,

                            function (
                                keywordResult,
                                keywordStatus
                            ) {


                                if (
                                    keywordStatus !==
                                        kakao.maps.services.Status.OK ||
                                    !keywordResult ||
                                    keywordResult.length === 0
                                ) {

                                    console.warn(
                                        "배송지 검색 실패:",
                                        apartmentName
                                    );


                                    return;

                                }


                                addMarker(
                                    apartmentName,
                                    apartmentOrders,
                                    keywordResult[0].y,
                                    keywordResult[0].x
                                );

                            }

                        );

                    }

                );

            }

        );



    function escapeHtml(value) {

        return String(
            value ?? ""
        )

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );

    }



    function getLocationNumbers(
        detailAddress
    ) {

        const detail =
            String(
                detailAddress || ""
            );


        const dongMatch =
            detail.match(
                /(\d+)\s*동/
            );


        const hoMatch =
            detail.match(
                /(\d+)\s*호/
            );


        return {

            dong:
                dongMatch
                    ? Number(
                        dongMatch[1]
                    )
                    : Number.MAX_SAFE_INTEGER,

            ho:
                hoMatch
                    ? Number(
                        hoMatch[1]
                    )
                    : Number.MAX_SAFE_INTEGER

        };

    }



    function sortApartmentOrders(
        apartmentOrders
    ) {

        return [
            ...apartmentOrders
        ].sort(

            (
                a,
                b
            ) => {

                const aLocation =
                    getLocationNumbers(
                        a.delivery_address_detail
                    );


                const bLocation =
                    getLocationNumbers(
                        b.delivery_address_detail
                    );


                if (
                    aLocation.dong !==
                    bLocation.dong
                ) {

                    return (
                        aLocation.dong -
                        bLocation.dong
                    );

                }


                if (
                    aLocation.ho !==
                    bLocation.ho
                ) {

                    return (
                        aLocation.ho -
                        bLocation.ho
                    );

                }


                return 0;

            }

        );

    }



    function getOrderItemsHtml(
        order
    ) {

        if (
            !order.order_items ||
            order.order_items.length === 0
        ) {

            return "-";

        }


        return order.order_items

            .map(
                item => {

                    const productName =
                        escapeHtml(
                            item.product_name ||
                            "-"
                        );


                    const quantity =
                        item.quantity ?? "";


                    return `
                        <div>
                            ${productName}
                            ${escapeHtml(quantity)}
                        </div>
                    `;

                }
            )

            .join("");

    }



    function addMarker(

        apartmentName,
        apartmentOrders,
        latitude,
        longitude

    ) {

        const position =
            new kakao.maps.LatLng(
                Number(latitude),
                Number(longitude)
            );


        const marker =
            new kakao.maps.Marker({

                map: map,

                position: position

            });


        deliveryMarkers[
            apartmentName
        ] = marker;


        const sortedOrders =
            sortApartmentOrders(
                apartmentOrders
            );


        const infoWindow =
            new kakao.maps.InfoWindow({

                content: ""

            });



        function closeInfoWindow() {

            infoWindow.close();


            if (
                activeInfoWindow ===
                infoWindow
            ) {

                activeInfoWindow = null;

            }

        }



        function showCompactInfo() {

            const content =
                document.createElement(
                    "div"
                );


            content.style.cssText = `
                padding:12px;
                min-width:220px;
                font-size:14px;
                line-height:1.5;
                position:relative;
            `;



            const title =
                document.createElement(
                    "strong"
                );


            title.textContent =
                `🏢 ${apartmentName}`;


            title.style.display =
                "block";


            title.style.paddingRight =
                "28px";



            const count =
                document.createElement(
                    "div"
                );


            count.textContent =
                `오늘 배송 ${sortedOrders.length}건`;


            count.style.marginTop =
                "5px";



            const closeButton =
                document.createElement(
                    "button"
                );


            closeButton.type =
                "button";


            closeButton.textContent =
                "×";


            closeButton.setAttribute(
                "aria-label",
                "배송 정보 닫기"
            );


            closeButton.style.cssText = `
                position:absolute;
                right:6px;
                top:2px;
                border:none;
                background:transparent;
                font-size:22px;
                line-height:1;
                padding:4px 7px;
                cursor:pointer;
            `;


            closeButton.addEventListener(

                "click",

                event => {

                    event.stopPropagation();

                    closeInfoWindow();

                }

            );



            const detailButton =
                document.createElement(
                    "button"
                );


            detailButton.type =
                "button";


            detailButton.textContent =
                "상세 보기";


            detailButton.style.cssText = `
                width:100%;
                margin-top:12px;
                padding:8px;
                border:none;
                border-radius:8px;
                background:#1f6f43;
                color:white;
                cursor:pointer;
            `;


            detailButton.addEventListener(

                "click",

                event => {

                    event.stopPropagation();

                    showDetailInfo();

                }

            );



            content.appendChild(
                closeButton
            );


            content.appendChild(
                title
            );


            content.appendChild(
                count
            );


            content.appendChild(
                detailButton
            );


            infoWindow.setContent(
                content
            );


            infoWindow.open(
                map,
                marker
            );


            activeInfoWindow =
                infoWindow;

        }

function showDetailInfo() {

    infoWindow.close();


    if (
        activeInfoWindow ===
        infoWindow
    ) {

        activeInfoWindow = null;

    }


    if (
        activeDetailOverlay
    ) {

        activeDetailOverlay.setMap(
            null
        );

        activeDetailOverlay = null;

    }



    const content =
        document.createElement(
            "div"
        );


    content.style.cssText = `
        width:280px;
        padding:12px;
        background:#ffffff;
        border:1px solid #dddddd;
        border-radius:10px;
        box-shadow:0 3px 10px rgba(0,0,0,0.22);
        font-size:14px;
        line-height:1.6;
        position:relative;
        box-sizing:border-box;
        transform:translateY(18px);
    `;



    const title =
        document.createElement(
            "strong"
        );


    title.textContent =
        `🏢 ${apartmentName}`;


    title.style.display =
        "block";


    title.style.paddingRight =
        "30px";



    const count =
        document.createElement(
            "div"
        );


    count.textContent =
        `오늘 배송 ${sortedOrders.length}건`;


    count.style.marginTop =
        "4px";


    count.style.marginBottom =
        "8px";



    const closeButton =
        document.createElement(
            "button"
        );


    closeButton.type =
        "button";


    closeButton.textContent =
        "×";


    closeButton.setAttribute(
        "aria-label",
        "배송 상세 닫기"
    );


    closeButton.style.cssText = `
        position:absolute;
        right:5px;
        top:3px;
        border:none;
        background:transparent;
        font-size:22px;
        line-height:1;
        padding:4px 7px;
        cursor:pointer;
        z-index:10;
    `;



    const orderList =
        document.createElement(
            "div"
        );


 orderList.style.cssText = `
    height:230px;
    overflow-y:scroll;
    overflow-x:hidden;
    padding-right:6px;
    box-sizing:border-box;
    overscroll-behavior:contain;
    scrollbar-gutter:stable;
    -webkit-overflow-scrolling:touch;
    pointer-events:auto;
`;

orderList.addEventListener(

    "wheel",

    event => {

        event.stopPropagation();

        kakao.maps.event.preventMap();

    },

    {
        passive: true
    }

);


orderList.addEventListener(

    "touchmove",

    event => {

        event.stopPropagation();

        kakao.maps.event.preventMap();

    },

    {
        passive: true
    }

);

    content.appendChild(
        closeButton
    );


    content.appendChild(
        title
    );


    content.appendChild(
        count
    );



    sortedOrders.forEach(
        order => {

            const orderBox =
                document.createElement(
                    "div"
                );


            orderBox.style.cssText = `
                padding:10px 0 12px;
                border-top:1px solid #dddddd;
            `;



            const orderNumber =
                document.createElement(
                    "button"
                );


            orderNumber.type =
                "button";


            orderNumber.textContent =
                `주문번호 : ${String(order.id).slice(0, 8)}`;


            orderNumber.style.cssText = `
                border:none;
                background:transparent;
                padding:0;
                font-weight:700;
                font-size:14px;
                text-decoration:underline;
                cursor:pointer;
                text-align:left;
            `;


            orderNumber.addEventListener(

                "click",

                () => {

                    location.href =
                        `admin-orders.html#${order.id}`;

                }

            );



            const location =
                document.createElement(
                    "div"
                );


            location.style.marginTop =
                "6px";


            location.textContent =
                `상세위치 : ${order.delivery_address_detail || "-"}`;



            const products =
                document.createElement(
                    "div"
                );


            products.style.marginTop =
                "4px";


            products.innerHTML =
                `상품 : ${getOrderItemsHtml(order)}`;



            const phone =
                document.createElement(
                    "div"
                );


            phone.style.marginTop =
                "4px";


            phone.textContent =
                `전화번호 : ${order.customer_phone || "-"}`;



            const orderViewButton =
                document.createElement(
                    "button"
                );


            orderViewButton.type =
                "button";


            orderViewButton.textContent =
                "주문 보기";


            orderViewButton.style.cssText = `
                width:100%;
                margin-top:9px;
                padding:8px;
                border:none;
                border-radius:8px;
                background:#1f6f43;
                color:white;
                cursor:pointer;
            `;


            orderViewButton.addEventListener(

                "click",

                () => {

                    location.href =
                        `admin-orders.html#${order.id}`;

                }

            );



            orderBox.appendChild(
                orderNumber
            );


            orderBox.appendChild(
                location
            );


            orderBox.appendChild(
                products
            );


            orderBox.appendChild(
                phone
            );


            orderBox.appendChild(
                orderViewButton
            );


            orderList.appendChild(
                orderBox
            );

        }

    );



    content.appendChild(
        orderList
    );


    orderList.scrollTop = 0;



    const detailOverlay =
        new kakao.maps.CustomOverlay({

            position: position,

            content: content,

            xAnchor: 0.5,

            yAnchor: 0,

            clickable: true,

            zIndex: 10

        });



    closeButton.addEventListener(

        "click",

        event => {

            event.stopPropagation();


            detailOverlay.setMap(
                null
            );


            if (
                activeDetailOverlay ===
                detailOverlay
            ) {

                activeDetailOverlay = null;

            }

        }

    );



    activeDetailOverlay =
        detailOverlay;


    detailOverlay.setMap(
        map
    );


    map.setCenter(
        position
    );


    map.panBy(
        0,
        190
    );

}
    kakao.maps.event.addListener(

    marker,

    "click",

    function () {

        if (
            activeDetailOverlay
        ) {

            activeDetailOverlay.setMap(
                null
            );

            activeDetailOverlay = null;

        }


        if (
            activeInfoWindow &&
            activeInfoWindow !==
            infoWindow
        ) {

            activeInfoWindow.close();

        }


        showCompactInfo();

    }

);

        bounds.extend(
            position
        );


        markerCount += 1;


        if (
            markerCount === 1
        ) {

            map.setCenter(
                position
            );


            map.setLevel(
                4
            );

        }


        if (
            markerCount >= 2
        ) {

            map.setBounds(
                bounds
            );

        }

    }

}



document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(

        "click",

        async () => {

            await supabaseClient.auth.signOut();

            moveToLogin();

        }

    );



window.onload =
    async function () {

        const isAdmin =
            await protectAdminPage();


        if (!isAdmin) {

            return;

        }


        await loadDeliveryOrders();

    };

</script>
