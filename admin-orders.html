<!DOCTYPE html>

<html lang="ko">

<head>

  <meta charset="UTF-8" />

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0"

  />

  <title>주문 관리 | 한농직판장 운영 OS</title>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      background: #f4f4f4;

      color: #222222;

      font-family:

        -apple-system,

        BlinkMacSystemFont,

        "Apple SD Gothic Neo",

        "Noto Sans KR",

        sans-serif;

    }

    header {

      background: #ffffff;

      border-bottom: 1px solid #dddddd;

      padding: 16px;

    }

    .header-inner {

      width: 100%;

      max-width: 900px;

      margin: 0 auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 12px;

    }

    .header-left {

      display: flex;

      align-items: center;

      gap: 12px;

    }

    .back-button,

    .logout-button {

      min-height: 42px;

      padding: 9px 14px;

      border: 1px solid #cccccc;

      border-radius: 8px;

      background: #ffffff;

      color: #222222;

      font-size: 15px;

      text-decoration: none;

      cursor: pointer;

    }

    h1 {

      margin: 0;

      font-size: 21px;

    }

    main {

      width: calc(100% - 32px);

      max-width: 900px;

      margin: 22px auto 50px;

    }

    .page-intro {

      margin-bottom: 16px;

      padding: 20px;

      border: 1px solid #dddddd;

      border-radius: 12px;

      background: #ffffff;

    }

    .page-intro h2 {

      margin: 0 0 8px;

      font-size: 21px;

    }

    .page-intro p {

      margin: 0;

      color: #666666;

      line-height: 1.6;

    }

    .filter-box {

      margin-bottom: 16px;

      padding: 16px;

      border: 1px solid #dddddd;

      border-radius: 12px;

      background: #ffffff;

    }

    .filter-buttons {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

    }

    .filter-button {

      min-height: 42px;

      padding: 9px 14px;

      border: 1px solid #cccccc;

      border-radius: 8px;

      background: #ffffff;

      color: #333333;

      font-size: 15px;

      cursor: pointer;

    }

    .filter-button.active {

      border-color: #222222;

      background: #222222;

      color: #ffffff;

    }

    .orders-box {

      padding: 20px;

      border: 1px solid #dddddd;

      border-radius: 12px;

      background: #ffffff;

    }

    .orders-box h2 {

      margin: 0 0 16px;

      font-size: 19px;

    }
.orders-list {

  display: grid;

  gap: 12px;

}

.order-card {

  padding: 18px;

  border: 1px solid #dddddd;

  border-radius: 10px;

  background: #ffffff;

}

.order-card-top {

  display: flex;

  align-items: flex-start;

  justify-content: space-between;

  gap: 12px;

  margin-bottom: 14px;

}

.order-number {

  margin-bottom: 5px;

  font-size: 16px;

  font-weight: 700;

}

.order-time {

  color: #777777;

  font-size: 14px;

}

.order-status {

  flex-shrink: 0;

  padding: 6px 10px;

  border-radius: 999px;

  background: #eeeeee;

  font-size: 14px;

  font-weight: 700;

}

.order-status.received {

  background: #fff3cd;

  color: #755700;

}

.order-status.paid {

  background: #e5f1ff;

  color: #15589b;

}

.order-status.preparing {

  background: #f1e8ff;

  color: #5f3290;

}

.order-status.completed {

  background: #e5f6e8;

  color: #247331;

}

.order-status.cancelled {

  background: #ffe8e8;

  color: #9c0000;

}

.order-summary {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px 16px;

  margin-bottom: 16px;

}

.order-info-item {

  min-width: 0;

}

.order-info-label {

  margin-bottom: 4px;

  color: #777777;

  font-size: 13px;

}

.order-info-value {

  overflow-wrap: anywhere;

  font-size: 15px;

  font-weight: 600;

  line-height: 1.5;

}

.order-products {

  margin-bottom: 16px;

  padding: 13px;

  border-radius: 8px;

  background: #f7f7f7;

  line-height: 1.6;

}

.order-card-bottom {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

}

.order-total {

  font-size: 18px;

  font-weight: 800;

}

.detail-button {

  min-height: 42px;

  padding: 10px 16px;

  border: 0;

  border-radius: 8px;

  background: #222222;

  color: #ffffff;

  font-size: 15px;

  font-weight: 700;

  text-decoration: none;

}

.preview-notice {

  margin-bottom: 14px;

  padding: 12px 14px;

  border: 1px solid #d7d7d7;

  border-radius: 8px;

  background: #fafafa;

  color: #666666;

  font-size: 14px;

  line-height: 1.5;

}

@media (max-width: 600px) {

  .order-summary {

    grid-template-columns: 1fr;

  }

  .order-card-bottom {

    align-items: stretch;

    flex-direction: column;

  }

  .detail-button {

    text-align: center;

  }

}    .empty-state {

      padding: 50px 20px;

      border: 1px dashed #cccccc;

      border-radius: 10px;

      background: #fafafa;

      text-align: center;

    }

    .empty-title {

      margin-bottom: 8px;

      font-size: 18px;

      font-weight: 700;

    }

    .empty-description {

      color: #777777;

      line-height: 1.6;

    }

    .status-message {

      display: none;

      margin-bottom: 16px;

      padding: 14px;

      border-radius: 8px;

      line-height: 1.5;

    }

    .status-message.error {

      display: block;

      border: 1px solid #e4b8b8;

      background: #fff0f0;

      color: #9c0000;

    }

    .loading-screen {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #ffffff;

      color: #333333;

      font-size: 17px;

    }

    @media (max-width: 600px) {

      header {

        padding: 12px;

      }

      .header-inner {

        align-items: flex-start;

      }

      .header-left {

        align-items: flex-start;

      }

      h1 {

        padding-top: 8px;

        font-size: 19px;

      }

      .logout-button {

        min-width: 74px;

        padding-left: 10px;

        padding-right: 10px;

      }

    }

  </style>

</head>

<body>

  <div id="loadingScreen" class="loading-screen">

    관리자 권한을 확인하고 있습니다...

  </div>

  <header>

    <div class="header-inner">

      <div class="header-left">

        <a

          class="back-button"

          href="./admin-dashboard.html"

        >

          ← 대시보드

        </a>

        <h1>주문 관리</h1>

      </div>

      <button

        id="logoutButton"

        class="logout-button"

        type="button"

      >

        로그아웃

      </button>

    </div>

  </header>

  <main>

    <section class="page-intro">

      <h2>전체 주문</h2>

      <p>

        접수된 주문의 상태를 확인하고 관리하는 화면입니다.

      </p>

    </section>

    <div

      id="statusMessage"

      class="status-message"

      role="alert"

    ></div>

    <section class="filter-box">

      <div class="filter-buttons">

        <button

          class="filter-button active"

          type="button"

        >

          전체

        </button>

        <button

          class="filter-button"

          type="button"

        >

          접수

        </button>

        <button

          class="filter-button"

          type="button"

        >

          결제완료

        </button>

        <button

          class="filter-button"

          type="button"

        >

          배송준비

        </button>

        <button

          class="filter-button"

          type="button"

        >

          배송완료

        </button>

        <button

          class="filter-button"

          type="button"

        >

          취소

        </button>

      </div>

    </section>
<section class="orders-box">

  <h2>주문 목록</h2>

  <div

    id="previewNotice"

    class="preview-notice"

  >

    현재 표시된 주문은 관리자 화면 설계를 확인하기 위한 예시입니다.

    실제 주문 데이터는 다음 단계에서 연결합니다.

  </div>

  <div

    id="ordersList"

    class="orders-list"

  ></div>

  <div

    id="emptyState"

    class="empty-state"

    hidden

  >

    <div class="empty-title">

      아직 등록된 주문이 없습니다.

    </div>

    <div class="empty-description">

      고객 주문이 저장되면<br />

      이 화면에서 바로 확인할 수 있습니다.

    </div>

  </div>

</section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =

      "https://rbtwvemljpgnwhlzayqy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =

      "sb_publishable_m-Uc3eR2-57P36HMP_eHsQ_F5h1tfzu";

    const supabaseClient = window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );

    const loadingScreen =

      document.getElementById("loadingScreen");

    const logoutButton =

      document.getElementById("logoutButton");

    const statusMessage =

      document.getElementById("statusMessage");

    function showError(message) {

      statusMessage.textContent = message;

      statusMessage.className = "status-message error";

    }

    function moveToLogin() {

      window.location.replace("./admin-login.html");

    }

    async function protectAdminPage() {

      try {

        const {

          data: { session },

          error: sessionError

        } = await supabaseClient.auth.getSession();

        if (sessionError) {

          throw sessionError;

        }

        if (!session) {

          moveToLogin();

          return;

        }

        const {

          data: admin,

          error: adminError

        } = await supabaseClient

          .from("admin_users")

          .select("user_id, is_active")

          .eq("user_id", session.user.id)

          .eq("is_active", true)

          .maybeSingle();

        if (adminError) {

          throw adminError;

        }

        if (!admin) {

          await supabaseClient.auth.signOut();

          moveToLogin();

          return;

        }

        loadingScreen.style.display = "none";

      } catch (error) {

        console.error(error);

        loadingScreen.style.display = "none";

        showError(

          error.message ||

          "관리자 정보를 확인하는 중 오류가 발생했습니다."

        );

      }

    }

    logoutButton.addEventListener(

      "click",

      async () => {

        logoutButton.disabled = true;

        logoutButton.textContent = "처리 중...";

        try {

          const { error } =

            await supabaseClient.auth.signOut();

          if (error) {

            throw error;

          }

          moveToLogin();

        } catch (error) {

          console.error(error);

          showError(

            error.message ||

            "로그아웃 중 오류가 발생했습니다."

          );

          logoutButton.disabled = false;

          logoutButton.textContent = "로그아웃";

        }

      }

    );
const ordersList =

  document.getElementById("ordersList");

const emptyState =

  document.getElementById("emptyState");

const previewNotice =

  document.getElementById("previewNotice");

const previewOrders = [

  {

    id: "20260730-001",

    phone: "010-1234-5678",

    apartment: "효자성원아파트",

    deliveryMethod: "아침 직접배송",

    products: [

      "구워 먹는 삼겹살 500g × 2",

      "국 끓이기 좋은 한우 국거리 300g × 1"

    ],

    totalAmount: 48000,

    status: "접수",

    statusClass: "received",

    orderedAt: "2026. 7. 30. 오후 2:35"

  }

];

function formatPrice(amount) {

  return Number(amount).toLocaleString("ko-KR") + "원";

}

function createOrderCard(order) {

  const productText =

    order.products.join("<br />");

  return `

    <article

      class="order-card"

      data-status="${order.status}"

    >

      <div class="order-card-top">

        <div>

          <div class="order-number">

            주문번호 ${order.id}

          </div>

          <div class="order-time">

            ${order.orderedAt}

          </div>

        </div>

        <div class="order-status ${order.statusClass}">

          ${order.status}

        </div>

      </div>

      <div class="order-summary">

        <div class="order-info-item">

          <div class="order-info-label">

            고객 전화번호

          </div>

          <div class="order-info-value">

            ${order.phone}

          </div>

        </div>

        <div class="order-info-item">

          <div class="order-info-label">

            배송 지역

          </div>

          <div class="order-info-value">

            ${order.apartment}

          </div>

        </div>

        <div class="order-info-item">

          <div class="order-info-label">

            배송 방법

          </div>

          <div class="order-info-value">

            ${order.deliveryMethod}

          </div>

        </div>

        <div class="order-info-item">

          <div class="order-info-label">

            현재 상태

          </div>

          <div class="order-info-value">

            ${order.status}

          </div>

        </div>

      </div>

      <div class="order-products">

        ${productText}

      </div>

      <div class="order-card-bottom">

        <div class="order-total">

          ${formatPrice(order.totalAmount)}

        </div>

        <a

          class="detail-button"

          href="./admin-order-detail.html?id=${encodeURIComponent(order.id)}"

        >

          주문 자세히 보기

        </a>

      </div>

    </article>

  `;

}

function renderOrders(orders, selectedStatus = "전체") {

  const filteredOrders =

    selectedStatus === "전체"

      ? orders

      : orders.filter(

          (order) => order.status === selectedStatus

        );

  if (filteredOrders.length === 0) {

    ordersList.innerHTML = "";

    emptyState.hidden = false;

    return;

  }

  emptyState.hidden = true;

  ordersList.innerHTML =

    filteredOrders

      .map(createOrderCard)

      .join("");

}

renderOrders(previewOrders);    
    
const filterButtons =

  document.querySelectorAll(".filter-button");

filterButtons.forEach((button) => {

  button.addEventListener("click", () => {

    filterButtons.forEach((item) => {

      item.classList.remove("active");

    });

    button.classList.add("active");

    const selectedStatus =

      button.textContent.trim();

    renderOrders(

      previewOrders,

      selectedStatus

    );

  });

});    const selectedStatus =

      button.textContent.trim();

    renderOrders(

      previewOrders,

      selectedStatus

    );

  });

});    protectAdminPage();

  </script>

</body>

</html>
