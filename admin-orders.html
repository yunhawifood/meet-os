<!DOCTYPE html>

  <style>

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      background: #f4f4f4;

      font-family:

        -apple-system,

    header {

      background: #ffffff;

    }

    .header-inner {

      align-items: center;

      display: flex;

      text-decoration: none;

      cursor: pointer;

    }

    h1 {

      margin: 0;

      font-size: 21px;

    }

    main {

      width: calc(100% - 32px);

      max-width: 900px;

      margin: 22px auto 50px;

    }

    .page-intro {

      margin-bottom: 16px;

      padding: 20px;

      border: 1px solid #dddddd;

      border-radius: 12px;

      background: #ffffff;

    }

    .page-intro h2 {

      margin: 0 0 8px;

      font-size: 21px;

    }

      color: #666666;

    .filter-box {

      margin-bottom: 16px;

      border: 1px solid #dddddd;

      border-radius: 12px;

      background: #ffffff;

    }

    .filter-buttons {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

    }

    .filter-button {

      min-height: 42px;

      padding: 9px 14px;

      border: 1px solid #cccccc;

      border-radius: 8px;

      background: #ffffff;

      color: #333333;

      font-size: 15px;

      cursor: pointer;

    }

    .filter-button.active {

      border-color: #222222;

      background: #222222;

      color: #ffffff;

    }

    .orders-box {

      padding: 20px;

      border: 1px solid #dddddd;

      border-radius: 12px;

      background: #ffffff;

    }

    .orders-box h2 {

      margin: 0 0 16px;

      font-size: 19px;

    }
.orders-list {

  display: grid;

  gap: 12px;

}

.order-card {

  padding: 18px;

  border: 1px solid #dddddd;

  border-radius: 10px;

  background: #ffffff;

}

.order-card-top {

  display: flex;

  align-items: flex-start;

  justify-content: space-between;

  gap: 12px;

  margin-bottom: 14px;

}

.order-number {

  margin-bottom: 5px;

  font-size: 16px;

  font-weight: 700;

}

.order-time {

  color: #777777;

  font-size: 14px;

}

.order-status {

  flex-shrink: 0;

  padding: 6px 10px;

  border-radius: 999px;

  background: #eeeeee;

  font-size: 14px;

  font-weight: 700;

}

.order-status.received {

  background: #fff3cd;

  color: #755700;

}

.order-status.paid {

  background: #e5f1ff;

  color: #15589b;

}

.order-status.preparing {

  background: #f1e8ff;

  color: #5f3290;

}

.order-status.completed {

  background: #e5f6e8;

  color: #247331;

}

.order-status.cancelled {

  background: #ffe8e8;

  color: #9c0000;

}

.order-summary {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px 16px;

  margin-bottom: 16px;

}

.order-info-item {

  min-width: 0;

}

.order-info-label {

  margin-bottom: 4px;

  color: #777777;

  font-size: 13px;

}

.order-info-value {

  overflow-wrap: anywhere;

  font-size: 15px;

  font-weight: 600;

  line-height: 1.5;

}

.order-products {

  margin-bottom: 16px;

  padding: 13px;

  border-radius: 8px;

  background: #f7f7f7;

  line-height: 1.6;

}

.order-card-bottom {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 12px;

}

.order-total {

  font-size: 18px;

  font-weight: 800;

}

.detail-button {

  min-height: 42px;

  padding: 10px 16px;

  border: 0;

  border-radius: 8px;

  background: #222222;

  color: #ffffff;

  font-size: 15px;

  font-weight: 700;

  text-decoration: none;

}

.preview-notice {

  margin-bottom: 14px;

  padding: 12px 14px;

  border: 1px solid #d7d7d7;

  border-radius: 8px;

  background: #fafafa;

  color: #666666;

  font-size: 14px;

  line-height: 1.5;

}

@media (max-width: 600px) {

  .order-summary {

    grid-template-columns: 1fr;

  }

  .order-card-bottom {

    align-items: stretch;

    flex-direction: column;

  }

  .detail-button {

    text-align: center;

  }

}    .empty-state {

      padding: 50px 20px;

      border: 1px dashed #cccccc;

      border-radius: 10px;

      background: #fafafa;

      text-align: center;

    }

    .empty-title {

      margin-bottom: 8px;

      font-size: 18px;

      font-weight: 700;

    }

    .empty-description {

      color: #777777;

      line-height: 1.6;

    }

    .status-message {

      display: none;

      margin-bottom: 16px;

      padding: 14px;

      border-radius: 8px;

      line-height: 1.5;

    }

    .status-message.error {

      display: block;

      border: 1px solid #e4b8b8;

      background: #fff0f0;

      color: #9c0000;

    }

    .loading-screen {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #ffffff;

      color: #333333;

      font-size: 17px;

    }

    @media (max-width: 600px) {

      header {

        padding: 12px;

      }

      .header-inner {

        align-items: flex-start;

      }

      .header-left {

        align-items: flex-start;

      }

      h1 {

        padding-top: 8px;

        font-size: 19px;

      }

      .logout-button {

        min-width: 74px;

        padding-left: 10px;

        padding-right: 10px;

      }

    }

  </style>

</head>

<body>

  <main>

</div>
<div

>

</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =

      "https://rbtwvemljpgnwhlzayqy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =

      "sb_publishable_m-Uc3eR2-57P36HMP_eHsQ_F5h1tfzu";

    const supabaseClient = window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );

    const loadingScreen =

      document.getElementById("loadingScreen");

    const logoutButton =

      document.getElementById("logoutButton");

    const statusMessage =

      document.getElementById("statusMessage");

    function showError(message) {

      statusMessage.textContent = message;

      statusMessage.className = "status-message error";

    }

    function moveToLogin() {

      window.location.replace("./admin-login.html");

    }

    async function protectAdminPage() {

      try {

        const {

          data: { session },

          error: sessionError

        } = await supabaseClient.auth.getSession();

        if (sessionError) {

          throw sessionError;

        }

        if (!session) {

          moveToLogin();

          return;

        }

        const {

          data: admin,

          error: adminError

        } = await supabaseClient

          .from("admin_users")

          .select("user_id, is_active")

          .eq("user_id", session.user.id)

          .eq("is_active", true)

          .maybeSingle();

        if (adminError) {

          throw adminError;

        }

        if (!admin) {

          await supabaseClient.auth.signOut();

          moveToLogin();

          return;

        }

        loadingScreen.style.display = "none";

      } catch (error) {

        console.error(error);

        loadingScreen.style.display = "none";

        showError(

          error.message ||

          "관리자 정보를 확인하는 중 오류가 발생했습니다."

        );

      }

    }

    logoutButton.addEventListener(

      "click",

      async () => {

        logoutButton.disabled = true;

        logoutButton.textContent = "처리 중...";

        try {

          const { error } =

            await supabaseClient.auth.signOut();

          if (error) {

            throw error;

          }

          moveToLogin();

        } catch (error) {

          console.error(error);

          showError(

            error.message ||

            "로그아웃 중 오류가 발생했습니다."

          );

          logoutButton.disabled = false;

          logoutButton.textContent = "로그아웃";

        }

      }

    );
const ordersList =

  document.getElementById("ordersList");

const emptyState =

  document.getElementById("emptyState");

const previewNotice =

  document.getElementById("previewNotice");

const previewOrders = [

  {

    id: "20260730-001",

    phone: "010-1234-5678",

    apartment: "효자성원아파트",
doorPassword: "1234#",
    deliveryMethod: "아침 직접배송",

    products: [

      "구워 먹는 삼겹살 500g × 2",

      "국 끓이기 좋은 한우 국거리 300g × 1"

    ],

    totalAmount: 48000,

    status: "접수",

    statusClass: "received",

    orderedAt: "2026. 7. 30. 오후 2:35"

  }

];
let completedOrders = [];
function formatPrice(amount) {

  return Number(amount).toLocaleString("ko-KR") + "원";

}
function createOrderCard(order) {

  const productText =
    order.products.join("<br />");

  return `

    <article class="order-card">

      <div class="order-number">
        주문번호 ${order.id}
      </div>
<div class="order-info">

<p>
전화번호<br>
<strong>${order.phone}</strong>
</p>

<p>
배송지역<br>
<strong>${order.apartment}</strong>
</p>

<p>
공동현관<br>
<strong>${order.doorPassword || "-"}</strong>
</p>

</div>
      <hr>


      <div class="order-products">

         주문 상품<br><br>

        ${productText}

      </div>


      <div class="order-total">

        ${formatPrice(order.totalAmount)}

      </div>


      <button type="button">
        📷 사진 전송하기
      </button>

<button 
  type="button"
  onclick="completeDelivery(this)">
  ✅ 배송 완료
</button>
     

    </article>

  `;

}

function renderOrders(orders, selectedStatus = "전체") {

  const filteredOrders =

    selectedStatus === "전체"

      ? orders

      : orders.filter(

          (order) => order.status === selectedStatus

        );

  if (filteredOrders.length === 0) {

    ordersList.innerHTML = "";

    emptyState.hidden = false;

    return;

  }

  emptyState.hidden = true;

  ordersList.innerHTML =

    filteredOrders

      .map(createOrderCard)

      .join("");

}
console.log(previewOrders);
renderOrders(previewOrders);    
    
const filterButtons =

  document.querySelectorAll(".filter-button");

filterButtons.forEach((button) => {

  button.addEventListener("click", () => {

    filterButtons.forEach((item) => {

      item.classList.remove("active");

    });

    button.classList.add("active");

    const selectedStatus =

      button.textContent.trim();

    renderOrders(

      previewOrders,

      selectedStatus

    );

  });

 }); 
    protectAdminPage();
function completeDelivery(button) {

    const card = button.closest(".order-card");

    if (card) {

        completedOrders.push({
            id: card.querySelector(".order-number").innerText,
            text: card.innerText,
            completedAt: new Date().toLocaleTimeString()
        });

        card.remove();

    }

}


function showTodayOrders() {

    renderOrders(previewOrders);

}


function showCompletedOrders() {

    ordersList.innerHTML = "";

    completedOrders.forEach((order) => {

        ordersList.innerHTML += `
        <article class="order-card">

            <h3>${order.id}</h3>

            <p>
            완료시간<br>
            ${order.completedAt}
            </p>

        </article>
        `;

    });

}
function sendPhotoMessage(phone) {

  const message =

`안녕하세요 한농직판장입니다.

주문하신 고기 제가 직접 손질하고
꼼꼼히 포장했습니다.

오늘 저녁 맛있게 드세요.
필요하실 때 언제든 이 번호로 연락주세요.`;

  const url =
    "sms:" + phone +
    "?body=" +
    encodeURIComponent(message);

  window.location.href = url;

}
