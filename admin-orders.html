function formatKoreanTime(dateString) {

  if (!dateString) {
    return "-";
  }

  const date = new Date(dateString);

  return date.toLocaleString("ko-KR", {
    timeZone: "Asia/Seoul",
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
    hour12: true
  });

}

    const loadingScreen =

      document.getElementById("loadingScreen");

    const logoutButton =

    function moveToLogin() {

      window.location.replace("./admin-login.html");

    }

    async function protectAdminPage() {

      try {

        const {

          data: { session },

          error: sessionError

        } = await supabaseClient.auth.getSession();

        if (sessionError) {

          throw sessionError;

        }

        if (!session) {

          moveToLogin();

          return;

        }

        const {

          data: admin,

          error: adminError

        } = await supabaseClient

          .from("admin_users")

          .select("user_id, is_active")

          .eq("user_id", session.user.id)

          .eq("is_active", true)

          .maybeSingle();

        if (adminError) {

          throw adminError;

        }

        if (!admin) {

          await supabaseClient.auth.signOut();

          moveToLogin();

          return;

        }

        loadingScreen.style.display = "none";

      } catch (error) {

        console.error(error);

        loadingScreen.style.display = "none";

        showError(

          error.message ||

          "관리자 정보를 확인하는 중 오류가 발생했습니다."

        );

      }

    }

const completedOrdersList = document.getElementById("completedOrdersList");

function formatPrice(amount) {

}
function focusOrderFromHash() {

    const orderId =
        decodeURIComponent(
            window.location.hash.slice(1)
        );


    if (!orderId) {

        window.scrollTo({
            top: 0,
            left: 0,
            behavior: "auto"
        });

        return false;

    }


    const orderCards =
        document.querySelectorAll(
            ".order-card"
        );


    const targetCard =
        Array.from(
            orderCards
        ).find(
            card =>
                card.dataset.id === orderId
        );


    if (!targetCard) {

        history.replaceState(
            null,
            "",
            window.location.pathname
        );


        window.scrollTo({
            top: 0,
            left: 0,
            behavior: "auto"
        });


        return false;

    }


    requestAnimationFrame(

        () => {

            targetCard.scrollIntoView({

                behavior: "smooth",

                block: "center"

            });


            targetCard.animate(

                [

                    {
                        transform: "scale(1)",
                        boxShadow:
                            "0 0 0 0 rgba(31,111,67,0)"
                    },

                    {
                        transform: "scale(1.01)",
                        boxShadow:
                            "0 0 0 5px rgba(31,111,67,0.30)"
                    },

                    {
                        transform: "scale(1)",
                        boxShadow:
                            "0 0 0 0 rgba(31,111,67,0)"
                    }

                ],

                {

                    duration: 1800,

                    easing: "ease-out"

                }

            );

        }

    );


    return true;

}

function renderOrders(orders, selectedStatus = "전체") {

  const uniqueOrders = orders.filter(
    (order, index, self) =>
      index === self.findIndex((o) => o.id === order.id)
  );


  const filteredOrders =

    selectedStatus === "전체"

      ? uniqueOrders

      : uniqueOrders.filter(

          (order) => order.order_status === selectedStatus

        );


  if (filteredOrders.length === 0) {

  todayOrdersList.innerHTML = "";

  return;

}

 todayOrdersList.innerHTML =
  filteredOrders
    .map(createOrderCard)
    .join("");

focusOrderFromHash();
}
if (

    async function completeDelivery(button) {

  if (button.disabled) return;

  button.disabled = true;
  button.textContent = "처리중...";

  const card = button.closest(".order-card");

  if (!card) {
    button.disabled = false;
    button.textContent = "✅ 배송 완료";
    return;
  }

  const orderId = card.dataset.id;


  const hashOrderId =
    decodeURIComponent(
      window.location.hash.slice(1)
    );


  const openedFromMap =
    hashOrderId === orderId;


  const { error } = await supabaseClient
    .from("orders")
    .update({
      order_status: "completed"
    })
    .eq("id", orderId)
    .eq("order_status", "received");


  if (error) {

    console.error(error);

    alert("배송 완료 처리 실패");

    button.disabled = false;
    button.textContent = "✅ 배송 완료";

    return;
  }


  alert("배송 완료 처리되었습니다.");


  if (openedFromMap) {

    window.location.href =
      "./admin-map.html";

    return;
  }


  await showTodayOrders();
  await showCompletedOrders();

}

async function loadOrders() {

    const { data, error } = await supabaseClient
  .from("orders")
  .select(`
    *,
    order_items (*)
  `)
  .eq("order_status", "received")
  .order("created_at", { ascending: false });
    if (error) {
        console.error(error);
        return [];
    }


    return data;

}
async function updateCompletedCount() {

    const { count, error } =
        await supabaseClient
            .from("orders")
            .select(
                "id",
                {
                    count: "exact",
                    head: true
                }
            )
            .eq(
                "order_status",
                "completed"
            );


    if (error) {

        console.error(
            "완료 건수 조회 오류:",
            error
        );

        return;

    }


    document
        .getElementById(
            "completedCount"
        )
        .innerText =
            `${count || 0}건`;

}
async function showTodayOrders() {

    const orders =
        await loadOrders();


    console.log(
        "오늘배송 불러온 주문:",
        orders
    );


    document
        .getElementById(
            "todayCount"
        )
        .innerText =
            orders.length + "건";


    await updateCompletedCount();


    const selectedStatus =
        "전체";


    renderOrders(
        orders,
        selectedStatus
    );


    loadPreparingStatus(
        orders
    );

}

document.getElementById("preparingContent");

        if(!order.order_items) return;


        order.order_items.forEach(item => {

            const name = item.product_name;


            const quantity =
            Number(item.quantity || 1);


            if(productCount[name]){
                productCount[name] += quantity;
            } else {
                productCount[name] = quantity;
            }

        });

    });


    if(Object.keys(productCount).length === 0){

        preparingContent.innerHTML =
        "준비할 상품이 없습니다.";

        return;

    }


    let html = "";


    Object.keys(productCount).forEach(name => {

        html += `
        <p>
        ${name} : ${productCount[name]}개
        </p>
        `;

    });


    preparingContent.innerHTML = html;

}

async function saveDeliveryLog() {


  if (!completedOrdersData || completedOrdersData.length === 0) {
    alert("저장할 배송 완료 목록이 없습니다.");
    return;
  }


  console.log("완료 주문 데이터:", completedOrdersData);
console.log("저장 직전 주문 데이터:", completedOrdersData);
console.log("저장 직전 상품 데이터:", completedOrdersData.map(order => order.order_items));
  const logs = completedOrdersData.map(order => ({

    id: crypto.randomUUID(),

    created_at: new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString(),

    order_id: order.id,

    customer_phone:
      order.customer_phone || "",

  delivery_address:
  `${order.delivery_address_main || ""} ${order.delivery_address_detail || ""}`,
    total_amount:
      order.total_amount || 0,

products: 
JSON.stringify(order.order_items || []),

    delivery_date:
  new Date(Date.now() + 9 * 60 * 60 * 1000)
    .toISOString()
    .slice(0,10)

  }));


  const { error } = await supabaseClient
    .from("delivery_logs")
    .insert(logs);


  if (error) {

    console.error("저장 오류:", error);

    alert(
      "배송 기록 저장 실패\n\n" +
      error.message
    );

    return;
  }


  await supabaseClient
    .from("daily_closings")
    .insert({
      closing_date:
  new Date(Date.now() + 9 * 60 * 60 * 1000)
    .toISOString()
    .slice(0,10),
      delivery_count: completedOrdersData.length,
      total_sales: completedOrdersData.reduce(
        (sum, order) => sum + (order.total_amount || 0),
        0
      ),
      memo: "",
      tomorrow_note: ""
    });


  const { data: closeData, error: closeError } = await supabaseClient
.from("orders")
.update({
  order_status: "closed"
})
.in(
  "id",
  completedOrdersData.map(order => order.id)
)
.select();

  console.log(
  "마감 처리할 주문 ID:",
  completedOrdersData.map(order => order.id)
);

console.log(closeData, closeError);

console.log(JSON.stringify(closeError));

alert("오늘 배송 기록 저장 완료");


  completedOrdersList.innerHTML = "";

}
