  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =

      "https://rbtwvemljpgnwhlzayqy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =

      "sb_publishable_m-Uc3eR2-57P36HMP_eHsQ_F5h1tfzu";

    const supabaseClient = window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );

    const loadingScreen =

      document.getElementById("loadingScreen");

    const logoutButton =

      document.getElementById("logoutButton");

    const statusMessage =

      document.getElementById("statusMessage");

    function showError(message) {

      statusMessage.textContent = message;

      statusMessage.className = "status-message error";

    }

    function moveToLogin() {

      window.location.replace("./admin-login.html");

    }

    async function protectAdminPage() {

      try {

        const {

          data: { session },

          error: sessionError

        } = await supabaseClient.auth.getSession();

        if (sessionError) {

          throw sessionError;

        }

        if (!session) {

          moveToLogin();

          return;

        }

        const {

          data: admin,

          error: adminError

        } = await supabaseClient

          .from("admin_users")

          .select("user_id, is_active")

          .eq("user_id", session.user.id)

          .eq("is_active", true)

          .maybeSingle();

        if (adminError) {

          throw adminError;

        }

        if (!admin) {

          await supabaseClient.auth.signOut();

          moveToLogin();

          return;

        }

        loadingScreen.style.display = "none";

      } catch (error) {

        console.error(error);

        loadingScreen.style.display = "none";

        showError(

          error.message ||

          "관리자 정보를 확인하는 중 오류가 발생했습니다."

        );

      }

    }

    logoutButton.addEventListener(

      "click",

      async () => {

        logoutButton.disabled = true;

        logoutButton.textContent = "처리 중...";

        try {

          const { error } =

            await supabaseClient.auth.signOut();

          if (error) {

            throw error;

          }

          moveToLogin();

        } catch (error) {

          console.error(error);

          showError(

            error.message ||

            "로그아웃 중 오류가 발생했습니다."

          );

          logoutButton.disabled = false;

          logoutButton.textContent = "로그아웃";

        }

      }

    );

  const todayOrdersList = document.getElementById("todayOrdersList");
const completedOrdersList = document.getElementById("completedOrdersList");

  const emptyState = document.getElementById("empty-state");

const previewNotice =

  document.getElementById("previewNotice");

const previewOrders = [

  {

    id: "20260730-001",

    phone: "010-1234-5678",

    apartment: "효자성원아파트",
doorPassword: "1234#",
    deliveryMethod: "아침 직접배송",

    products: [

      "구워 먹는 삼겹살 500g × 2",

      "국 끓이기 좋은 한우 국거리 300g × 1"

    ],

    totalAmount: 48000,

    status: "접수",

    statusClass: "received",

    orderedAt: "2026. 7. 30. 오후 2:35"

  }

];
let completedOrders = [];
function formatPrice(amount) {

  return Number(amount).toLocaleString("ko-KR") + "원";

}
function createOrderCard(order) {

  const productText = order.order_items
  ? order.order_items.map(item => item.product_name).join("<br />")
  : "";

  return `

    <article class="order-card" data-id="${order.id}">

      <div class="order-number">
        주문번호 ${order.id.slice(0,8)}
      </div>
<div class="order-info">

<p>
전화번호<br>
<strong>${order.customer_phone}</strong>
</p>

<p>
배송지역<br>
<strong>
${order.delivery_address_main} ${order.delivery_address_detail || ""}
</strong>
</p>

<p>
공동현관<br>
<strong>
${order.door_password || "-"}
</strong>
</p>
</div>
      <hr>


      <div class="order-products">

         주문 상품<br><br>

        ${productText}

      </div>


      <div class="order-total">

        ${formatPrice(order.total_amount)}

      </div>

<div class="order-actions">

  <button
    type="button"
    onclick="sendPhotoMessage('${order.customer_phone}')"
  >
    📷 고객에게 사진 보내기
  </button>

  <button
    type="button"
    onclick="completeDelivery(this)"
  >
    ✅ 배송 완료
  </button>

</div>
    
     

    </article>

  `;

}

function renderOrders(orders, selectedStatus = "전체") {

  const filteredOrders =

    selectedStatus === "전체"

      ? orders

      : orders.filter(

          (order) => order.order_status === selectedStatus

        );

  if (filteredOrders.length === 0) {

    todayOrdersList.innerHTML = "";

    emptyState.hidden = false;

    return;

  }

todayOrdersList.innerHTML =
  filteredOrders
  .map(createOrderCard)
  .join("");
}
showTodayOrders();
    
const filterButtons =

  document.querySelectorAll(".filter-button");

filterButtons.forEach((button) => {

  button.addEventListener("click", async () => {

    filterButtons.forEach((item) => {

      item.classList.remove("active");

    });

    button.classList.add("active");

 const selectedStatus =
    button.textContent.trim() === "오늘 배송"
      ? "received"
      : "completed";

const orders = await loadOrders();

renderOrders(
    orders,
    selectedStatus
);

  });

 }); 
    protectAdminPage();
async function completeDelivery(button) {

  const card = button.closest(".order-card");

  if (!card) return;

  const orderId = card.dataset.id;

  const { error } = await supabaseClient
    .from("orders")
    .update({
      order_status: "completed"
    })
    .eq("id", orderId);


  if (error) {
    console.error(error);
    alert("배송 완료 처리 실패");
    return;
  }


  alert("배송 완료 처리되었습니다.");

  card.remove();

}
async function loadOrders() {

    const { data, error } = await supabaseClient
  .from("orders")
  .select(`
    *,
    order_items (*)
  `)
  .eq("order_status", "received")
  .order("created_at", { ascending: false });
    if (error) {
        console.error(error);
        return [];
    }


    return data;

}

async function showTodayOrders() {

    todayOrdersList.innerHTML = "";
    completedOrdersList.innerHTML = "";

    const orders = await loadOrders();
console.log("오늘배송 불러온 주문:", orders);
    const selectedStatus = "전체";
    renderOrders(
        orders,
        selectedStatus
    );

}
let completedOrdersData = [];
async function showCompletedOrders() {

  todayOrdersList.innerHTML = "";
  completedOrdersList.innerHTML = "";

  const { data, error } = await supabaseClient
    .from("orders")
    .select("*")
    .eq("order_status", "completed")
    .order("created_at", { ascending: false });


  if (error) {
    console.error(error);
    completedOrdersList.innerHTML = `
      <p>완료 목록을 불러오지 못했습니다.</p>
    `;
    return;
  }
completedOrdersData = data;

  if (!data || data.length === 0) {
    completedOrdersList.innerHTML = "";
    return;
}


  data.forEach((order) => {

    completedOrdersList.innerHTML += `

      <article class="order-card" data-id="${order.id}">

       <div class="completed-top">

  <div>
    <h3>
      주문 번호 #${order.id.slice(0,8)}
    </h3>

    <p>
      완료시간<br>
      ${order.updated_at || "-"}
    </p>

  </div>

</div>

<div class="completed-toggle">

<button
type="button"
onclick="toggleCompletedDetail(this)">
확인하기
</button>

<button
type="button"
onclick="restoreOrder('${order.id}')">
되돌리기
</button>

</div>
<div class="completed-detail" style="display:none;">

          <br>

          전화번호<br>
          ${order.customer_phone || "-"}

          <br><br>

          배송지역<br>
          ${order.delivery_address_main || "-"}

          <br><br>

          배송완료 여부<br>
          완료

        </div>


      </article>

    `;

  });


  completedOrdersList.innerHTML += `

    <button
    type="button"
    onclick="saveDeliveryLog()">
    오늘 마감하기
    </button>

  `;

}
function toggleCompletedDetail(button) {

  const detail = button.closest(".order-card")
                       .querySelector(".completed-detail");

  if(detail.style.display === "none"){
    detail.style.display = "block";
    button.innerText = "접기";
  } else {
    detail.style.display = "none";
    button.innerText = "확인하기";
  }

}
async function restoreOrder(orderId) {

  const confirmRestore = confirm(
    "배송 완료를 취소하시겠습니까?\n\n오늘 배송 목록으로 다시 이동합니다."
  );

  if (!confirmRestore) {
    return;
  }

  const { error } = await supabaseClient
    .from("orders")
    .update({
      order_status: "received"
    })
    .eq("id", orderId);

  if (error) {
    alert("되돌리기에 실패했습니다.");
    console.error(error);
    return;
  }

  alert("배송 목록으로 되돌렸습니다.");
console.log("되돌리기 후 실행");
  showTodayOrders();
}
function sendPhotoMessage(phone) {

  const message =

`안녕하세요 한농직판장입니다.

주문하신 고기 제가 직접 손질하고
꼼꼼히 포장했습니다.

맛있게 드시고,
필요하실 때 언제든 이 번호로 연락주세요.`;

  const url =
    "sms:" + phone +
    "?body=" +
    encodeURIComponent(message);

  window.location.href = url;

}
async function saveDeliveryLog() {

  if (!completedOrdersData || completedOrdersData.length === 0) {
    alert("저장할 배송 완료 목록이 없습니다.");
    return;
  }


  const logs = completedOrdersData.map(order => ({

    id: crypto.randomUUID(),

    created_at: new Date().toISOString(),

    order_id: order.id,

    customer_phone:
      order.customer_phone || "",

    delivery_address:
      order.delivery_address_main || "",

    total_amount:
      order.total_amount || 0,

    products:
      JSON.stringify(order.order_items || []),

    delivery_date:
      new Date().toISOString().slice(0,10)

  }));


  const { error } = await supabaseClient
    .from("delivery_logs")
    .insert(logs);


  if (error) {

    console.error("저장 오류:", error);

    alert(
      "배송 기록 저장 실패\n\n" +
      error.message
    );

    return;
  }


  await supabaseClient
    .from("daily_closings")
    .insert({
      closing_date: new Date().toISOString().slice(0,10),
      delivery_count: completedOrdersData.length,
      total_sales: completedOrdersData.reduce(
        (sum, order) => sum + (order.total_amount || 0),
        0
      ),
      memo: "",
      tomorrow_note: ""
    });


  const { data: closeData, error: closeError } = await supabaseClient
.from("orders")
.update({
  order_status: "closed"
})
.in(
  "id",
  completedOrdersData.map(order => order.id)
)
.select();

  console.log(
  "마감 처리할 주문 ID:",
  completedOrdersData.map(order => order.id)
);

console.log(closeData, closeError);

console.log(JSON.stringify(closeError));

alert("오늘 배송 기록 저장 완료");


  completedOrdersList.innerHTML = "";

}
  </script>
