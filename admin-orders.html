function formatKoreanTime(dateString) {

  if (!dateString) {
    return "-";
  }

  const date = new Date(dateString);

  return date.toLocaleString("ko-KR", {
    timeZone: "Asia/Seoul",
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit",
    hour12: true
  });

}

function getKoreanDate(offsetDays = 0) {

  return new Date(
    Date.now() +
    9 * 60 * 60 * 1000 +
    offsetDays * 24 * 60 * 60 * 1000
  )
    .toISOString()
    .slice(0, 10);

}

function isFutureDeferredOrder(order) {

  const deferredUntil = String(
    order?.delivery_deferred_until || ""
  );

  return Boolean(
    deferredUntil && deferredUntil > getKoreanDate()
  );

}

function isDeliveryActionable(order) {

  return !isFutureDeferredOrder(order);

}

function formatKoreanDateOnly(dateString) {

  if (!dateString) return "-";

  const parts = String(dateString).split("-");

  if (parts.length !== 3) return String(dateString);

  return `${Number(parts[1])}월 ${Number(parts[2])}일`;

}

    async function protectAdminPage() {

      try {

        const {

          data: { session },

          error: sessionError

        } = await supabaseClient.auth.getSession();

        if (sessionError) {

          throw sessionError;

        }

        if (!session) {

          moveToLogin();

          return;

        }

        const {

          data: admin,

          error: adminError

        } = await supabaseClient

          .from("admin_users")

          .select("user_id, is_active")

          .eq("user_id", session.user.id)

          .eq("is_active", true)

          .maybeSingle();

        if (adminError) {

          throw adminError;

        }

        if (!admin) {

          await supabaseClient.auth.signOut();

          moveToLogin();

          return;

        }

        loadingScreen.style.display = "none";

        console.error(error);

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

function formatOrderItemsHtml(
  orderItems,
  includeQuantity = false
) {

  if (!Array.isArray(orderItems) || orderItems.length === 0) {
    return "-";
  }

  return orderItems
    .map(item => {

      const weight =
        item.selected_weight ||
        (
          item.weight_grams
            ? item.weight_grams + "g"
            : ""
        );

        item.product_name,
        item.selected_use,
        weight

        .filter(Boolean)

        .join(" · ");

      if (!includeQuantity) {
        return label || "-";
      }

      const quantity = Number(item.quantity || 1);
      const safeQuantity =
        Number.isFinite(quantity) && quantity > 0
          ? quantity

      return `${label || "-"} ${safeQuantity}개`;

    })
    .join("<br />");

function handleOrderActionClick(event) {

  const button = event.target.closest(
    "button[data-action]"
  );

  if (
    !button ||
    !event.currentTarget.contains(button)
  ) {
    return;
  }

  const action = button.dataset.action;

  if (action === "send-photo") {
    sendPhotoMessage(button.dataset.phone || "");
    return;
  }

  if (action === "complete-delivery") {
    void completeDelivery(button);
    return;
  }

  if (action === "defer-delivery") {
    openDeferralDialog(
      button.dataset.orderId || "",
      button.dataset.currentDate || ""
    );
    return;
  }

  if (action === "restore-deferred") {
    void restoreDeferredOrder(
      button.dataset.orderId || "",
      button
    );
    return;
  }

  if (action === "cancel-payment") {
    void cancelPayment(button);
    return;
  }

  if (action === "toggle-completed-detail") {
    toggleCompletedDetail(button);
    return;
  }

  if (action === "restore-order") {
    void restoreOrder(button.dataset.orderId || "");
    return;
  }

  if (action === "close-day") {
    void checkBeforeClosing(button);
  }

}

async function cancelPayment(button) {

  if (button.disabled) return;

  const card = button.closest(".order-card");
  const externalOrderId = String(
    button.dataset.externalOrderId ||
    card?.dataset.externalOrderId ||
    ""
  ).trim();
  const amount = Number(
    button.dataset.amount || 0
  );

  if (!/^YH_[a-f0-9]{32}$/i.test(externalOrderId)) {
    alert(
      "결제 주문번호를 확인할 수 없습니다. NICEPAY에서 확인해주세요."
    );
    return;
  }

  const amountText = Number.isFinite(amount)
    ? formatPrice(amount)
    : "결제금액";

  const firstConfirmed = confirm(
    `${amountText} 전액을 결제 취소합니다.\n\n` +
    "취소 후에는 되돌릴 수 없습니다. 계속하시겠습니까?"
  );

  if (!firstConfirmed) return;

  const typedConfirmation = prompt(
    "실수 방지를 위해 아래 입력칸에 ‘취소’를 정확히 입력해주세요."
  );

  if (typedConfirmation !== "취소") {
    alert("결제 취소를 중단했습니다.");
    return;
  }

  button.disabled = true;
  const originalText = button.textContent;
  button.textContent = "결제 취소 처리중...";

  try {

    const {
      data: { session },
      error: sessionError
    } = await supabaseClient.auth.getSession();

    if (sessionError) {
      throw sessionError;
    }

    if (!session?.access_token) {
      moveToLogin();
      return;
    }

    const response = await fetch(
      PAYMENT_API_BASE + "/admin/orders/cancel",
      {
        method: "POST",
        headers: {
          Authorization:
            "Bearer " + session.access_token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          externalOrderId,
          confirmation: "취소"
        })
      }
    );

    let result = null;

    try {
      result = await response.json();
    } catch {
      result = null;
    }

    if (!response.ok || !result?.ok) {
      throw new Error(
        result?.message ||
        "결제 취소 결과를 확인할 수 없습니다. 다시 누르지 말고 NICEPAY 거래내역을 확인해주세요."
      );
    }

    alert(
      result.message ||
      "결제 취소가 완료되었습니다."
    );

    await showTodayOrders();
    await showCompletedOrders();

  } catch (error) {

    console.error(error);

    alert(
      error.message ||
      "결제 취소 처리 중 오류가 발생했습니다. 다시 누르지 말고 NICEPAY 거래내역을 확인해주세요."
    );

    button.disabled = false;
    button.textContent = originalText;

  }

}

function loadPreparingStatus(orders) {

  const preparingContent =
    document.getElementById(
      "preparingContent"
    );

  const productCount = {};

  orders.forEach(order => {

    if (!order.order_items) {
      return;
    }

    order.order_items.forEach(item => {

      const weight =
        item.selected_weight ||
        (
          item.weight_grams
            ? item.weight_grams + "g"
            : ""
        );

      const label = [
        item.product_name,
        item.selected_use,
        weight
      ]
        .filter(Boolean)
        .join(" / ");

      const quantity =
        Number(item.quantity || 1);

      if (productCount[label]) {

        productCount[label] +=
          quantity;

      } else {

        productCount[label] =
          quantity;

      }

    });

  });

  if (
    Object.keys(productCount)
      .length === 0
  ) {

    preparingContent.textContent =
      "준비할 상품이 없습니다.";

    return;

  }

  preparingContent.replaceChildren();

  Object.keys(productCount)
    .forEach(label => {

      const paragraph =
        document.createElement("p");

      paragraph.textContent =
        `${label} : ${productCount[label]}개`;

      preparingContent.appendChild(
        paragraph
      );

    });

}

function sendPhotoMessage(phone) {

  const safePhone =
    String(phone || "")
      .replace(/[^0-9]/g, "");

  if (
    safePhone.length !== 10 &&
    safePhone.length !== 11
  ) {
    alert("고객 전화번호를 확인해주세요.");
    return;
  }

  const message =

`안녕하세요 한농직판장입니다.

주문하신 고기 제가 직접 손질하고
꼼꼼히 포장했습니다.

맛있게 드시고,
필요하실 때 언제든 이 번호로 연락주세요.`;

  const url =
    "sms:" + safePhone +
    "?body=" +
    encodeURIComponent(message);

  window.location.href = url;

}
async function checkBeforeClosing(button) {

  button.disabled = true;
  button.textContent = "배송 마감 처리중...";

  const { data, error } = await supabaseClient
    .from("orders")
    .select("id,delivery_deferred_until")
    .eq("order_status", "received");


  if (error) {
  console.error(error);
  alert("배송 상태 확인 실패");

  button.disabled = false;
  button.textContent = "오늘 배송 마감";

  return;
}

console.log("미완료 주문 검색 결과:", data);
if (!data) {

  alert("배송 상태를 확인할 수 없습니다.");

  button.textContent = "오늘 배송 마감";

  return;

}
const unfinishedTodayOrders = data.filter(

);

if (unfinishedTodayOrders.length > 0) {

    );

    button.disabled = false;
    button.textContent = "오늘 배송 마감";

    return;
  }


// 오늘 마감 중복 확인

const today = new Date(Date.now() + 9 * 60 * 60 * 1000)
  .toISOString()
  .slice(0,10);


const { data: closingData, error: closingError } = await supabaseClient
  .from("daily_closings")

if (closingError) {

}


if (closingData && closingData.length > 0) {

    "오늘 마감 기록이 이미 있습니다.\n중복 저장할 수 없습니다."

async function saveDeliveryLog() {


  if (!completedOrdersData || completedOrdersData.length === 0) {
    alert("저장할 배송 완료 목록이 없습니다.");
    return false;
  }


  console.log("완료 주문 데이터:", completedOrdersData);
console.log("저장 직전 주문 데이터:", completedOrdersData);
console.log("저장 직전 상품 데이터:", completedOrdersData.map(order => order.order_items));
  const logs = completedOrdersData.map(order => ({

    id: crypto.randomUUID(),

    created_at: new Date(Date.now() + 9 * 60 * 60 * 1000).toISOString(),

    order_id: order.id,

    customer_phone:
      order.customer_phone || "",

  delivery_address:
  `${order.delivery_address_main || ""} ${order.delivery_address_detail || ""}`,
    total_amount:
      order.total_amount || 0,

products: 
JSON.stringify(order.order_items || []),

    delivery_date:
      order.delivery_deferred_until ||
      getKoreanDate()

  }));


  const { error } = await supabaseClient
    .from("delivery_logs")
    .insert(logs);


  if (error) {

    console.error("저장 오류:", error);

    alert(
      "배송 기록 저장 실패\n\n" +
      error.message
    );

    return false;
  }


  await supabaseClient
    .from("daily_closings")
    .insert({
      closing_date:
  new Date(Date.now() + 9 * 60 * 60 * 1000)
    .toISOString()
    .slice(0,10),
      delivery_count: completedOrdersData.length,
      total_sales: completedOrdersData.reduce(
        (sum, order) => sum + (order.total_amount || 0),
        0
      ),
      memo: "",
      tomorrow_note: ""
    });


  const { data: closeData, error: closeError } = await supabaseClient
.from("orders")
.update({
  order_status: "closed"
})
.in(
  "id",
  completedOrdersData.map(order => order.id)
)
.select();

  console.log(
  "마감 처리할 주문 ID:",
  completedOrdersData.map(order => order.id)
);

console.log(closeData, closeError);

console.log(JSON.stringify(closeError));

alert("오늘 배송 기록 저장 완료");


  completedOrdersList.innerHTML = "";

  return true;

}
