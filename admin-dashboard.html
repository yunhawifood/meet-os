  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =

      "https://rbtwvemljpgnwhlzayqy.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =

      "sb_publishable_m-Uc3eR2-57P36HMP_eHsQ_F5h1tfzu";

    const supabaseClient = window.supabase.createClient(

      SUPABASE_URL,

      SUPABASE_PUBLISHABLE_KEY

    );
async function updateDeliveryCount() {
  const { count, error } = await supabaseClient
    .from("orders")
    .select("*", { count: "exact", head: true })
    .eq("order_status", "received");

  if (error) {
    console.error(error);
    return;
  }

  document.getElementById("delivery-count").innerText = `${count}건`;
}

updateDeliveryCount();

    const loadingScreen =

      document.getElementById("loadingScreen");

    const adminName =

      document.getElementById("adminName");

    const logoutButton =

      document.getElementById("logoutButton");

    const statusMessage =

      document.getElementById("statusMessage");

    function showError(message) {

      statusMessage.textContent = message;

      statusMessage.className = "status-message error";

    }

    async function moveToLogin() {

      window.location.replace("./admin-login.html");

    }

    async function protectAdminPage() {

      try {

        const {

          data: { session },

          error: sessionError

        } = await supabaseClient.auth.getSession();

        if (sessionError) {

          throw sessionError;

        }

        if (!session) {

          await moveToLogin();

          return;

        }

        const {

          data: admin,

          error: adminError

        } = await supabaseClient

          .from("admin_users")

          .select(

            "user_id, display_name, role, is_active"

          )

          .eq("user_id", session.user.id)

          .eq("is_active", true)

          .maybeSingle();

        if (adminError) {

          throw adminError;

        }

        if (!admin) {

          await supabaseClient.auth.signOut();

          await moveToLogin();

          return;

        }

        adminName.textContent =

          admin.display_name || "대표님";

        loadingScreen.style.display = "none";

      } catch (error) {

        console.error(error);

        loadingScreen.style.display = "none";

        showError(

          error.message ||

          "관리자 정보를 확인하는 중 오류가 발생했습니다."

        );

      }

    }
const ORDER_INTAKE_API =
  "https://yunhawi-payment-api.yunhawifood.workers.dev/admin/order-intake";


async function getAdminAccessToken() {

  const {
    data: { session },
    error,
  } =
    await supabaseClient.auth.getSession();

  if (error) {
    throw error;
  }

  if (!session?.access_token) {
    throw new Error(
      "관리자 로그인 세션이 없습니다."
    );
  }

  return session.access_token;
}


function renderOrderIntakeStatus(intake) {

  const status =
    document.getElementById(
      "orderIntakeStatus"
    );

  const closeButton =
    document.getElementById(
      "closeOrderIntakeButton"
    );

  const openButton =
    document.getElementById(
      "openOrderIntakeButton"
    );

  if (!status) return;


  if (intake?.isOpen) {

    status.textContent =
      "● 주문 접수중";

    status.className =
      "intake-status open";

    closeButton.hidden = false;
    openButton.hidden = true;

  } else {

    status.textContent =
      "● 주문 마감";

    status.className =
      "intake-status closed";

    closeButton.hidden = true;
    openButton.hidden = false;

  }
}


async function requestOrderIntake(
  path = "",
  method = "GET",
) {

  const accessToken =
    await getAdminAccessToken();

  const response =
    await fetch(
      ORDER_INTAKE_API + path,
      {
        method,
        headers: {
          Accept:
            "application/json",
          Authorization:
            "Bearer " +
            accessToken,
        },
        cache: "no-store",
      }
    );

  const data =
    await response.json();

  if (!response.ok || !data.ok) {

    throw new Error(
      data.message ||
      "주문 접수 상태를 처리하지 못했습니다."
    );

  }

  return data;
}


async function loadOrderIntakeStatus() {

  try {

    const data =
      await requestOrderIntake();

    renderOrderIntakeStatus(
      data.intake
    );

  } catch (error) {

    console.error(error);

    const status =
      document.getElementById(
        "orderIntakeStatus"
      );

    if (status) {
      status.textContent =
        "상태 확인 실패";
    }

  }
}


document
  .getElementById(
    "closeOrderIntakeButton"
  )
  ?.addEventListener(
    "click",
    async () => {

      const confirmed =
        confirm(
          "오늘 새벽배송 주문 접수를 마감하시겠습니까?"
        );

      if (!confirmed) return;


      try {

        const data =
          await requestOrderIntake(
            "/close",
            "POST",
          );

        renderOrderIntakeStatus(
          data.intake
        );

        alert(
          "오늘 주문 접수를 마감했습니다."
        );

      } catch (error) {

        alert(
          error.message ||
          "주문 마감에 실패했습니다."
        );

      }

    }
  );


document
  .getElementById(
    "openOrderIntakeButton"
  )
  ?.addEventListener(
    "click",
    async () => {

      const confirmed =
        confirm(
          "오늘 주문 접수를 다시 여시겠습니까?"
        );

      if (!confirmed) return;


      try {

        const data =
          await requestOrderIntake(
            "/open",
            "POST",
          );

        renderOrderIntakeStatus(
          data.intake
        );

        alert(
          "주문 접수를 다시 열었습니다."
        );

      } catch (error) {

        alert(
          error.message ||
          "주문 열기에 실패했습니다."
        );

      }

    }
  );
    logoutButton.addEventListener(

      "click",

      async () => {

        logoutButton.disabled = true;

        logoutButton.textContent = "처리 중...";

        try {

          const { error } =

            await supabaseClient.auth.signOut();

          if (error) {

            throw error;

          }

          await moveToLogin();

        } catch (error) {

          console.error(error);

          showError(

            error.message ||

            "로그아웃 중 오류가 발생했습니다."

          );

          logoutButton.disabled = false;

          logoutButton.textContent = "로그아웃";

        }

      }

    );

   protectAdminPage()
  .then(loadOrderIntakeStatus);
  </script>
